name: Tests

on:
  push:
    branches: ['**']
  pull_request:

# Make every `npm install` resilient to transient registry hiccups (the npm
# fetch layer retries ECONNRESET / timeouts instead of failing the job).
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_factor: '2'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '600000'

jobs:
  core-php:
    name: Core (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      # Write a real .env so dotenv loads the secret into $_ENV regardless of the
      # runner's variables_order. The tests read $_ENV['FLUXFILES_SECRET'] and
      # firebase/php-jwt v7 rejects HS256 keys shorter than 32 bytes.
      - name: Write .env with test secret
        run: echo "FLUXFILES_SECRET=ci-test-secret-$(openssl rand -hex 16)" > .env

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - name: Show resolved dependency versions
        working-directory: packages/core
        run: composer show firebase/php-jwt league/flysystem intervention/image aws/aws-sdk-php 2>/dev/null | grep -E "name|versions" || true

      - name: Lint all PHP sources
        run: |
          find packages/core/api packages/core/embed.php packages/core/router.php \
               packages/laravel/src packages/wordpress/includes packages/wordpress/fluxfiles.php \
               -name '*.php' -print0 2>/dev/null | xargs -0 -n1 php -l

      - name: Run unit/integration test suite
        working-directory: packages/core
        run: |
          set -e
          for f in tests/unit/*.php tests/integration/*.php; do
            echo "::group::$(basename "$f")"
            php "$f"
            echo "::endgroup::"
          done

      - name: WordPress plugin smoke (stubbed WP, uses core autoload)
        run: php packages/wordpress/tests/test-wp-smoke.php

      - name: Laravel adapter smoke (stubbed Laravel, uses core autoload)
        run: php packages/laravel/tests/test-laravel-smoke.php

  adapter-core-floor:
    name: Adapter ↔ core floor guard
    runs-on: ubuntu-latest
    steps:
      # Need full history + tags so the guard can build core at each adapter's
      # declared composer floor (a `core-vX.Y.Z` monorepo tag) in a worktree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      # Runs each PHP adapter's smoke against core built at its declared floor.
      # Fails if an adapter uses a core API newer than its composer.json allows
      # (the failure mode behind the sanitizeVariants 500). Skips an adapter
      # whose floor tag isn't released yet (warning, not failure).
      - name: Check adapters against their declared core floor
        run: bash scripts/check-adapter-core-floor.sh

  api-e2e:
    name: API e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      # High rate limits so the 42-request test-api.sh suite doesn't trip the
      # default 60 read / 10 write per-minute limiter (which returns 429).
      - name: Write .env with test secret
        run: |
          {
            echo "FLUXFILES_SECRET=ci-test-secret-$(openssl rand -hex 16)"
            echo "FLUXFILES_RATE_LIMIT_READ=10000"
            echo "FLUXFILES_RATE_LIMIT_WRITE=10000"
          } > .env

      - name: Start standalone server
        working-directory: packages/core
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/fluxfiles-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/public/ >/dev/null && break
            sleep 0.5
          done

      - name: Run API test suite
        run: bash packages/core/tests/e2e/test-api.sh

      - name: Server log on failure
        if: failure()
        run: cat /tmp/fluxfiles-server.log || true

  s3-minio:
    name: Live S3 (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      # Run MinIO via `docker run` (not a service container) so we can pass the
      # required `server /data` command — GitHub service containers can't override it,
      # and bitnami/minio's free Docker Hub tags were removed in 2025.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done

      - name: Run live S3 test against MinIO
        working-directory: packages/core
        env:
          FXTEST_S3_LABEL: MinIO
          FXTEST_S3_ENDPOINT: http://127.0.0.1:9000
          FXTEST_S3_REGION: us-east-1
          FXTEST_S3_BUCKET: fluxfiles-test
          FXTEST_S3_KEY: minioadmin
          FXTEST_S3_SECRET: minioadmin123
          FXTEST_S3_VISIBILITY: private
          FXTEST_S3_CREATE_BUCKET: '1'
        run: php tests/e2e/test-s3-live.php

      - name: MinIO log on failure
        if: failure()
        run: docker logs minio || true

  wrappers:
    name: Wrapper (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [sdk, react, vue, ckeditor4, tinymce, summernote]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + test ${{ matrix.pkg }}
        working-directory: packages/${{ matrix.pkg }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          npm test

  node-sdk:
    name: Node token SDK (PHP↔Node parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # PHP + core vendor so the cross-language parity test actually runs
      # (Node-minted tokens decode in the PHP core; BYOB blobs round-trip both
      # ways) instead of skipping.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + typecheck + build + test @fluxfiles/node
        working-directory: packages/node
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  browser-e2e:
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + chromium
        working-directory: packages/core/tests/browser
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npx playwright install --with-deps chromium

      - name: Run Playwright e2e (boots the PHP server, drives the iframe UI)
        working-directory: packages/core/tests/browser
        run: npx playwright test

  pack-smoke:
    name: Pack & install (published artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build, pack, install each wrapper into a throwaway consumer
        run: |
          for p in sdk react vue; do bash scripts/ci-retry.sh npm install --prefix packages/$p --no-audit --no-fund; done
          bash scripts/pack-smoke.sh all

  docker-build:
    name: Docker production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f docker/Dockerfile.prod -t fluxfiles/fluxfiles:ci .
      - name: Smoke the image (public routes respond)
        run: |
          docker run -d --name ff -p 8081:80 -e FLUXFILES_SECRET=ci-docker-secret-0123456789abcdef fluxfiles/fluxfiles:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8081/public/ >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/public/index.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/fm/lang)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/fm/list?disk=local')" = "401"
          docker rm -f ff
