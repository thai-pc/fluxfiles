name: Tests

on:
  push:
    branches: ['**']
  pull_request:

# Make every `npm install` resilient to transient registry hiccups (the npm
# fetch layer retries ECONNRESET / timeouts instead of failing the job).
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_factor: '2'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'
  npm_config_fetch_timeout: '600000'

jobs:
  core-php:
    name: Core (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      # Write a real .env so dotenv loads the secret into $_ENV regardless of the
      # runner's variables_order. The tests read $_ENV['FLUXFILES_SECRET'] and
      # firebase/php-jwt v7 rejects HS256 keys shorter than 32 bytes.
      - name: Write .env with test secret
        run: echo "FLUXFILES_SECRET=ci-test-secret-$(openssl rand -hex 16)" > .env

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - name: Show resolved dependency versions
        working-directory: packages/core
        run: composer show firebase/php-jwt league/flysystem intervention/image aws/aws-sdk-php 2>/dev/null | grep -E "name|versions" || true

      - name: Lint all PHP sources
        run: |
          find packages/core/api packages/core/embed.php packages/core/router.php \
               packages/laravel/src packages/wordpress/includes packages/wordpress/fluxfiles.php \
               -name '*.php' -print0 2>/dev/null | xargs -0 -n1 php -l

      - name: Run unit/integration test suite
        working-directory: packages/core
        run: |
          set -e
          for f in tests/unit/*.php tests/integration/*.php; do
            echo "::group::$(basename "$f")"
            php "$f"
            echo "::endgroup::"
          done

      - name: WordPress plugin smoke (stubbed WP, uses core autoload)
        run: php packages/wordpress/tests/test-wp-smoke.php

      - name: Laravel adapter smoke (stubbed Laravel, uses core autoload)
        run: php packages/laravel/tests/test-laravel-smoke.php

  adapter-core-floor:
    name: Adapter ↔ core floor guard
    runs-on: ubuntu-latest
    steps:
      # Need full history + tags so the guard can build core at each adapter's
      # declared composer floor (a `core-vX.Y.Z` monorepo tag) in a worktree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      # Runs each PHP adapter's smoke against core built at its declared floor.
      # Fails if an adapter uses a core API newer than its composer.json allows
      # (the failure mode behind the sanitizeVariants 500). Skips an adapter
      # whose floor tag isn't released yet (warning, not failure).
      - name: Check adapters against their declared core floor
        run: bash scripts/check-adapter-core-floor.sh

  iframe-allow:
    name: iframe allow parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Pure-bash guard: SDK / React / Vue / WordPress must grant the identical
      # iframe `allow` (fullscreen + clipboard) + allowfullscreen — no drift.
      - name: Check iframe allow parity
        run: bash scripts/check-iframe-allow.sh

  api-e2e:
    name: API e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      # High rate limits so the 42-request test-api.sh suite doesn't trip the
      # default 60 read / 10 write per-minute limiter (which returns 429).
      - name: Write .env with test secret
        run: |
          {
            echo "FLUXFILES_SECRET=ci-test-secret-$(openssl rand -hex 16)"
            echo "FLUXFILES_RATE_LIMIT_READ=10000"
            echo "FLUXFILES_RATE_LIMIT_WRITE=10000"
          } > .env

      - name: Start standalone server
        working-directory: packages/core
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/fluxfiles-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/public/ >/dev/null && break
            sleep 0.5
          done

      - name: Run API test suite
        run: bash packages/core/tests/e2e/test-api.sh

      - name: Server log on failure
        if: failure()
        run: cat /tmp/fluxfiles-server.log || true

  # The tests/e2e/*-http.php suites each boot their own `php -S`, back up and restore
  # packages/core/.env, and use a distinct port — so they run sequentially in one job.
  # They were previously runnable only by hand, which meant the routing-level behaviour
  # they cover (stream/img token gating, share enforcement, the virus fail-closed gate)
  # had no CI at all: test-api.sh was the only e2e that ran.
  selfboot-e2e:
    name: Self-booting e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      # SFTP is the only disk driver with no CI coverage: test-sftp-http.php and
      # test-sftp-live.php are env-gated and nothing ever set the env. atmoz/sftp needs
      # its user spec as a command argument, which `services:` cannot express — hence a
      # plain `docker run`. If it fails to come up we leave FXTEST_SFTP_HOST unset so the
      # test skips loudly instead of failing the job on infrastructure.
      - name: Start SFTP server (atmoz/sftp)
        run: |
          docker run -d --name ff-sftp -p 2222:22 atmoz/sftp ff:ffpass:::upload
          # Readiness must be the SSH BANNER, not an open port: docker binds the host
          # port the instant the container starts, long before sshd inside is listening,
          # so a plain TCP probe reports ready far too early and the suite then fails
          # with 500s that look like application bugs.
          for i in $(seq 1 60); do
            banner=$( (exec 3<>/dev/tcp/127.0.0.1/2222 && head -c 4 <&3) 2>/dev/null )
            if [ "${banner}" = "SSH-" ]; then
              echo "SFTP ready after ${i}s"
              {
                echo "FXTEST_SFTP_HOST=127.0.0.1"
                echo "FXTEST_SFTP_PORT=2222"
                echo "FXTEST_SFTP_USERNAME=ff"
                echo "FXTEST_SFTP_PASSWORD=ffpass"
                echo "FXTEST_SFTP_ROOT=upload"
                echo "FXTEST_SFTP_ALLOW_HOST=1"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::SFTP container did not come up — the SFTP suites will skip"
          docker logs ff-sftp 2>&1 | tail -30 || true

      - name: Run the self-booting e2e suites
        working-directory: packages/core
        run: |
          fail=0
          for f in tests/e2e/*-http.php; do
            echo "::group::$(basename "$f")"
            php "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # The live SFTP driver suite (not a *-http.php file, so not in the loop above).
      # It is the counterpart to the s3-minio job: same idea, the other driver.
      - name: Live SFTP driver suite
        working-directory: packages/core
        run: php tests/e2e/test-sftp-live.php

      # The other half of the parity matrix: SFTP has real directories like local, but
      # reaches them over a network adapter with its own move/copy/list semantics.
      - name: Directory parity (local + SFTP)
        working-directory: packages/core
        run: php tests/integration/test-dir-parity.php

      - name: SFTP container log on failure
        if: failure()
        run: docker logs ff-sftp 2>&1 | tail -50 || true

      - name: Stop SFTP server
        if: always()
        run: docker rm -f ff-sftp || true

  s3-minio:
    name: Live S3 (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      # Run MinIO via `docker run` (not a service container) so we can pass the
      # required `server /data` command — GitHub service containers can't override it,
      # and bitnami/minio's free Docker Hub tags were removed in 2025.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break
            sleep 1
          done

      - name: Run live S3 test against MinIO
        working-directory: packages/core
        env:
          FXTEST_S3_LABEL: MinIO
          FXTEST_S3_ENDPOINT: http://127.0.0.1:9000
          FXTEST_S3_REGION: us-east-1
          FXTEST_S3_BUCKET: fluxfiles-test
          FXTEST_S3_KEY: minioadmin
          FXTEST_S3_SECRET: minioadmin123
          FXTEST_S3_VISIBILITY: private
          FXTEST_S3_CREATE_BUCKET: '1'
          # The container is thrown away at the end of the job, so the prefix-wide
          # directory scenarios are safe to run here. Everywhere else they need this
          # opt-in deliberately — see the guards at the top of the script.
          FXTEST_S3_ALLOW_DESTRUCTIVE: '1'
        run: php tests/e2e/test-s3-live.php

      # The parity matrix against a REAL object store. It also runs local-only in the
      # core-php job (it is picked up by that job's tests/integration/*.php loop), but
      # local alone cannot catch the divergence class it exists for: an operation that
      # behaves differently when a directory is only a key prefix.
      - name: Directory parity (local + S3)
        working-directory: packages/core
        env:
          FXTEST_S3_LABEL: MinIO
          FXTEST_S3_ENDPOINT: http://127.0.0.1:9000
          FXTEST_S3_REGION: us-east-1
          FXTEST_S3_BUCKET: fluxfiles-test
          FXTEST_S3_KEY: minioadmin
          FXTEST_S3_SECRET: minioadmin123
          FXTEST_S3_VISIBILITY: private
        run: php tests/integration/test-dir-parity.php

      - name: MinIO log on failure
        if: failure()
        run: docker logs minio || true

  wrappers:
    name: Wrapper (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [sdk, react, vue, ckeditor4, tinymce, summernote]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + test ${{ matrix.pkg }}
        working-directory: packages/${{ matrix.pkg }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          npm test

  node-sdk:
    name: Node token SDK (PHP↔Node parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # PHP + core vendor so the cross-language parity test actually runs
      # (Node-minted tokens decode in the PHP core; BYOB blobs round-trip both
      # ways) instead of skipping.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + typecheck + build + test @fluxfiles/node
        working-directory: packages/node
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  browser-e2e:
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, curl, json, openssl, mbstring, fileinfo, zip
          coverage: none

      - name: Install core dependencies
        run: composer update -d packages/core --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + chromium
        working-directory: packages/core/tests/browser
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npx playwright install --with-deps chromium

      - name: Run Playwright e2e (boots the PHP server, drives the iframe UI)
        working-directory: packages/core/tests/browser
        run: npx playwright test

  editor-e2e:
    name: Editor plugins e2e (real TinyMCE / CKEditor 4 / Summernote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP (static file server for the harness)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build editor plugins (the tests load the shipped plugin.min.js)
        run: |
          for p in tinymce ckeditor4 summernote; do
            (cd "packages/$p" && bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --no-audit --no-fund && npm run build)
          done

      - name: Vendor the real editor libs + Playwright
        working-directory: packages/core/tests/editors
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --ignore-scripts --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npx playwright install --with-deps chromium

      - name: Run live editor e2e (real editors + shipped plugins, watermark handling)
        working-directory: packages/core/tests/editors
        run: npx playwright test

  pack-smoke:
    name: Pack & install (published artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, pack, install each wrapper into a throwaway consumer
        run: |
          for p in sdk react vue; do bash scripts/ci-retry.sh npm install --prefix packages/$p --no-audit --no-fund; done
          bash scripts/pack-smoke.sh all

  docker-build:
    name: Docker production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f docker/Dockerfile.prod -t fluxfiles/fluxfiles:ci .
      - name: Smoke the image (public routes respond)
        run: |
          docker run -d --name ff -p 8081:80 -e FLUXFILES_SECRET=ci-docker-secret-0123456789abcdef fluxfiles/fluxfiles:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8081/public/ >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/public/index.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/fm/lang)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8081/api/fm/list?disk=local')" = "401"
          docker rm -f ff
