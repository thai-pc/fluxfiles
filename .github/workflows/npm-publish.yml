name: Publish npm packages

on:
  push:
    tags: ['v*']

jobs:
  # No-build packages: ship source files directly (sdk = fluxfiles.js, editor
  # plugins = plugin.js). `--access public` is required for the scoped ones.
  publish-nobuild:
    name: Publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [sdk, ckeditor4, tinymce]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish (skip if version exists)
        working-directory: packages/${{ matrix.pkg }}
        run: npm publish --access public || echo "Version already published, skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Bundled packages: build dist first, then publish.
  publish-build:
    name: Publish ${{ matrix.adapter }} adapter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [react, vue]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: packages/${{ matrix.adapter }}
        run: npm install

      - name: Build
        working-directory: packages/${{ matrix.adapter }}
        run: npm run build

      - name: Publish (skip if version exists)
        working-directory: packages/${{ matrix.adapter }}
        run: npm publish --access public || echo "Version already published, skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
