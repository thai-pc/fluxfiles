name: Publish npm packages

on:
  push:
    tags:
      - "sdk-v*"
      - "react-v*"
      - "vue-v*"
      - "ckeditor4-v*"
      - "tinymce-v*"
      - "summernote-v*"
      - "node-v*"

jobs:
  publish:
    name: Publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: sdk
            tag_prefix: "sdk-"
            build: "false"
          - pkg: ckeditor4
            tag_prefix: "ckeditor4-"
            build: "false"
          - pkg: tinymce
            tag_prefix: "tinymce-"
            build: "false"
          - pkg: summernote
            tag_prefix: "summernote-"
            build: "false"
          - pkg: react
            tag_prefix: "react-"
            build: "true"
          - pkg: vue
            tag_prefix: "vue-"
            build: "true"
          - pkg: node
            tag_prefix: "node-"
            build: "true"   # builds dist/ via tsup (also runs on prepublishOnly)

    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref_name, matrix.tag_prefix)

      - uses: actions/setup-node@v6
        if: startsWith(github.ref_name, matrix.tag_prefix)
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        if: startsWith(github.ref_name, matrix.tag_prefix)
        working-directory: packages/${{ matrix.pkg }}
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_TAG="${MONOREPO_TAG#${TAG_PREFIX}}"
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${MONOREPO_TAG} does not match packages/${{ matrix.pkg }}/package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        if: startsWith(github.ref_name, matrix.tag_prefix) && matrix.build == 'true'
        working-directory: packages/${{ matrix.pkg }}
        run: npm install

      - name: Build
        if: startsWith(github.ref_name, matrix.tag_prefix) && matrix.build == 'true'
        working-directory: packages/${{ matrix.pkg }}
        run: npm run build

      - name: Publish (skip only if this version already exists)
        if: startsWith(github.ref_name, matrix.tag_prefix)
        working-directory: packages/${{ matrix.pkg }}
        # Re-runs must be idempotent, so swallow an "already published" conflict —
        # but ONLY that. Auth/network/other errors must FAIL the job (a bare
        # `|| echo` once hid an expired-NPM_TOKEN 404 and went green).
        run: |
          set -o pipefail
          if npm publish --access public 2>&1 | tee /tmp/pub.log; then
            echo "Published."
          else
            if grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|You cannot publish over the previously published versions' /tmp/pub.log; then
              echo "::notice::Version already published — skipping."
            else
              echo "::error::npm publish failed (not an already-published conflict). Check NPM_TOKEN validity/permissions."
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
