name: Publish Docker image

# Builds the standalone FluxFiles app (nginx + php-fpm, docker/Dockerfile.prod)
# and pushes it to GHCR on every core release tag. Users then just:
#   docker run -p 8080:80 -e FLUXFILES_SECRET=... ghcr.io/thai-pc/fluxfiles:latest
on:
  push:
    tags:
      - "core-v*"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3      # arm64 emulation
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxfiles
          # core-v0.2.18 → 0.2.18 (+ 0.2) + latest. On workflow_dispatch only `latest`.
          tags: |
            type=match,pattern=core-v(.*),group=1
            type=match,pattern=core-v(\d+\.\d+),group=1
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
