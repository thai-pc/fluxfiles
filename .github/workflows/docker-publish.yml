name: Publish Docker image

# Builds the standalone FluxFiles app (nginx + php-fpm, docker/Dockerfile.prod)
# and pushes it to GHCR on every core release tag (and only then:
# a manual run from a branch must not be able to move :latest). Users then just:
#   docker run -p 8080:80 -e FLUXFILES_SECRET=... ghcr.io/thai-pc/fluxfiles:latest
on:
  push:
    tags:
      - "core-v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: release   # no rules by default; the owner may add required reviewers
    permissions:
      contents: read
      packages: write   # required to push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release tags must be cut from master (an unreviewed branch must not publish).
      - name: Tag must be on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on master"; exit 1; }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0      # arm64 emulation
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxfiles
          # core-v0.2.18 → 0.2.18 (+ 0.2) + latest.
          tags: |
            type=match,pattern=core-v(.*),group=1
            type=match,pattern=core-v(\d+\.\d+),group=1
            type=raw,value=latest

      # Smoke test before anything is pushed: an image whose UI can't load its
      # bundled JS (e.g. .dockerignore dropping assets/vendor) renders a blank page.
      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          load: true
          tags: fluxfiles:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name ff-smoke -p 8080:80 -e FLUXFILES_SECRET="$(openssl rand -hex 32)" fluxfiles:smoke
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/public/index.html && break; sleep 1; done
          for u in /public/index.html /assets/fm.js /assets/vendor/alpine/alpine.min.js /fluxfiles.js /fluxfiles.min.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$u")
            echo "$u -> $code"; [ "$code" = 200 ] || { docker logs ff-smoke; exit 1; }
          done
          TOKEN=$(docker exec ff-smoke php -r 'require "/app/packages/core/embed.php"; echo fluxfiles_token(userId: "smoke", perms: ["read"], disks: ["local"]);')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/fm/list?disk=local&path=")
          echo "api list -> $code"; [ "$code" = 200 ]
          docker rm -f ff-smoke

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
