name: Publish PyPI packages

on:
  push:
    tags:
      - "python-v*"

jobs:
  publish:
    name: Publish fluxfiles-token
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no long-lived
      # PYPI_API_TOKEN secret to rotate/leak.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches pyproject.toml version
        working-directory: packages/python
        env:
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_TAG="${MONOREPO_TAG#python-}"
          PACKAGE_VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$PACKAGE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${MONOREPO_TAG} does not match packages/python/pyproject.toml version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        working-directory: packages/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          # Re-runs must be idempotent, so this ONLY swallows an "already
          # published" conflict for the exact version — any other failure
          # (auth, network, validation) still fails the job. Mirrors
          # npm-publish.yml's care about not blanket-swallowing exit codes.
          skip-existing: true
