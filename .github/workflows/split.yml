name: Split Packages

on:
  push:
    tags:
      - "core-v*"
      - "laravel-v*"

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    # One tag = one package, so a single job (a two-entry matrix would leave one
    # no-op job per tag and double the approvals if `release` gets reviewers).
    # The environment has no protection rules until the owner adds some.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release tags must be cut from master (an unreviewed branch must not publish).
      - name: Tag must be on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on master"; exit 1; }

      - name: Resolve package from tag
        id: pkg
        env:
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          case "$MONOREPO_TAG" in
            core-v*)    NAME=core ;;
            laravel-v*) NAME=laravel ;;
            *) echo "::error::Unexpected tag ${MONOREPO_TAG}"; exit 1 ;;
          esac
          echo "tag_prefix=${NAME}-" >> "$GITHUB_OUTPUT"
          echo "local=packages/${NAME}" >> "$GITHUB_OUTPUT"
          echo "remote=fluxfiles-${NAME}" >> "$GITHUB_OUTPUT"

      # Auth is the SPLIT_TOKEN in the push URL below, not the checkout credential
      # (persist-credentials: false).
      - name: Split and push ${{ steps.pkg.outputs.remote }}
        env:
          PAT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          REMOTE_REPO: ${{ steps.pkg.outputs.remote }}
          PKG_DIR: ${{ steps.pkg.outputs.local }}
          TAG_PREFIX: ${{ steps.pkg.outputs.tag_prefix }}
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PACKAGE_TAG="${MONOREPO_TAG#${TAG_PREFIX}}"
          case "$PACKAGE_TAG" in
            v*) ;;
            *) echo "::error::Expected ${TAG_PREFIX}vX.Y.Z, got ${MONOREPO_TAG}"; exit 1 ;;
          esac

          SPLIT_SHA=$(git subtree split -P "$PKG_DIR" -b split-branch)
          echo "Split $PKG_DIR at $SPLIT_SHA -> $REMOTE_REPO:$PACKAGE_TAG"

          REMOTE_URL="https://x-access-token:${PAT_TOKEN}@github.com/thai-pc/${REMOTE_REPO}.git"

          git remote add target "$REMOTE_URL"
          git push -f target split-branch:main
          git tag -f "$PACKAGE_TAG" split-branch
          git push -f target "$PACKAGE_TAG"

      # Nudge Packagist to crawl the new tag immediately instead of waiting for
      # its periodic crawl (which lagged badly — core sat at an old version for
      # days). No-op (warning, not failure) when the secret isn't configured.
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REMOTE_REPO: ${{ steps.pkg.outputs.remote }}
        run: |
          if [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::warning::PACKAGIST_TOKEN secret not set — Packagist will only update on its slow periodic crawl. Set PACKAGIST_USERNAME + PACKAGIST_TOKEN to auto-sync."
            exit 0
          fi
          code=$(curl -s -o /tmp/pkg.out -w '%{http_code}' -XPOST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/thai-pc/${REMOTE_REPO}\"}}")
          echo "Packagist update for ${REMOTE_REPO}: HTTP ${code}"; cat /tmp/pkg.out || true
          # Packagist returns 202 (Accepted) on a successful queued update, 200 otherwise.
          case "$code" in
            200|202) ;;
            *) echo "::warning::Packagist returned HTTP ${code} (check the PACKAGIST_* secrets / package URL)" ;;
          esac
