name: Split Packages

on:
  push:
    tags:
      - "core-v*"
      - "laravel-v*"

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: core
            tag_prefix: "core-"
            local: "packages/core"
            remote: "fluxfiles-core"
          - name: laravel
            tag_prefix: "laravel-"
            local: "packages/laravel"
            remote: "fluxfiles-laravel"

    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref_name, matrix.package.tag_prefix)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push ${{ matrix.package.remote }}
        if: startsWith(github.ref_name, matrix.package.tag_prefix)
        env:
          PAT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          REMOTE_REPO: ${{ matrix.package.remote }}
          PKG_DIR: ${{ matrix.package.local }}
          TAG_PREFIX: ${{ matrix.package.tag_prefix }}
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PACKAGE_TAG="${MONOREPO_TAG#${TAG_PREFIX}}"
          case "$PACKAGE_TAG" in
            v*) ;;
            *) echo "::error::Expected ${TAG_PREFIX}vX.Y.Z, got ${MONOREPO_TAG}"; exit 1 ;;
          esac

          SPLIT_SHA=$(git subtree split -P "$PKG_DIR" -b split-branch)
          echo "Split $PKG_DIR at $SPLIT_SHA -> $REMOTE_REPO:$PACKAGE_TAG"

          REMOTE_URL="https://x-access-token:${PAT_TOKEN}@github.com/thai-pc/${REMOTE_REPO}.git"

          git remote add target "$REMOTE_URL"
          git push -f target split-branch:main
          git tag -f "$PACKAGE_TAG" split-branch
          git push -f target "$PACKAGE_TAG"
