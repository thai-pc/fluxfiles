name: Split Packages

on:
  push:
    tags:
      - "core-v*"
      - "laravel-v*"

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: core
            tag_prefix: "core-"
            local: "packages/core"
            remote: "fluxfiles-core"
          - name: laravel
            tag_prefix: "laravel-"
            local: "packages/laravel"
            remote: "fluxfiles-laravel"

    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref_name, matrix.package.tag_prefix)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push ${{ matrix.package.remote }}
        if: startsWith(github.ref_name, matrix.package.tag_prefix)
        env:
          PAT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          REMOTE_REPO: ${{ matrix.package.remote }}
          PKG_DIR: ${{ matrix.package.local }}
          TAG_PREFIX: ${{ matrix.package.tag_prefix }}
          MONOREPO_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PACKAGE_TAG="${MONOREPO_TAG#${TAG_PREFIX}}"
          case "$PACKAGE_TAG" in
            v*) ;;
            *) echo "::error::Expected ${TAG_PREFIX}vX.Y.Z, got ${MONOREPO_TAG}"; exit 1 ;;
          esac

          SPLIT_SHA=$(git subtree split -P "$PKG_DIR" -b split-branch)
          echo "Split $PKG_DIR at $SPLIT_SHA -> $REMOTE_REPO:$PACKAGE_TAG"

          REMOTE_URL="https://x-access-token:${PAT_TOKEN}@github.com/thai-pc/${REMOTE_REPO}.git"

          git remote add target "$REMOTE_URL"
          git push -f target split-branch:main
          git tag -f "$PACKAGE_TAG" split-branch
          git push -f target "$PACKAGE_TAG"

      # Nudge Packagist to crawl the new tag immediately instead of waiting for
      # its periodic crawl (which lagged badly — core sat at an old version for
      # days). No-op (warning, not failure) when the secret isn't configured.
      - name: Notify Packagist
        if: startsWith(github.ref_name, matrix.package.tag_prefix)
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REMOTE_REPO: ${{ matrix.package.remote }}
        run: |
          if [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::warning::PACKAGIST_TOKEN secret not set — Packagist will only update on its slow periodic crawl. Set PACKAGIST_USERNAME + PACKAGIST_TOKEN to auto-sync."
            exit 0
          fi
          code=$(curl -s -o /tmp/pkg.out -w '%{http_code}' -XPOST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/thai-pc/${REMOTE_REPO}\"}}")
          echo "Packagist update for ${REMOTE_REPO}: HTTP ${code}"; cat /tmp/pkg.out || true
          [ "$code" = "200" ] || echo "::warning::Packagist returned HTTP ${code} (check the PACKAGIST_* secrets / package URL)"
