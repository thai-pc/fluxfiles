<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The share token rides the URL (?token=). It's a narrow read-only token scoped
       to one file, but still don't leak it via Referer to sub-resources / links. -->
  <meta name="referrer" content="no-referrer">
  <title>Shared file</title>
  <script>
    (function () {
      var t = typeof localStorage !== 'undefined' && localStorage.getItem('fluxfiles_theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    :root { --bg:#f5f5f7; --card:#fff; --fg:#1b1b22; --muted:#6b7280; --accent:#7c3aed; --border:rgba(0,0,0,.1); --ok:#16a34a; --err:#dc2626; }
    html.dark { --bg:#16161a; --card:#1f1f25; --fg:#e6e6ea; --muted:#9aa0aa; --border:rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; width:100%; max-width:520px; padding:28px;
            box-shadow:0 10px 40px rgba(0,0,0,.10); }
    h1 { font-size:20px; margin:0 0 4px; overflow-wrap:anywhere; }
    .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
    .meta { font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.7; }
    input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--fg);
                           font-size:14px; margin-bottom:12px; }
    button { width:100%; padding:11px 14px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-size:14.5px; font-weight:600;
             cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .preview { margin:18px 0 4px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:rgba(127,127,127,.06); }
    .preview img { display:block; width:100%; height:auto; }
    .preview iframe { display:block; width:100%; height:420px; border:0; }
    .msg { padding:14px; border-radius:10px; font-size:14px; text-align:center; }
    .msg.err { background:rgba(220,38,38,.1); color:var(--err); }
    .dlerr { color:var(--err); font-size:12.5px; text-align:center; margin-top:10px; }
    .hidden { display:none; }
    .brand { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .brand img { height:28px; width:auto; border-radius:4px; }
    .brand span { font-weight:600; font-size:14px; }
    .brand a { color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="gate" class="msg err hidden" role="alert"></div>

    <div id="lock" class="hidden">
      <div id="brandLock" class="brand hidden"></div>
      <h1>Password required</h1>
      <p class="sub">This link is protected. Enter the password to continue.</p>
      <label for="pw" class="hidden">Password</label>
      <input type="password" id="pw" placeholder="Password" autocomplete="off">
      <button id="unlock" type="button">Unlock</button>
      <div class="meta" id="lockmeta" role="alert"></div>
    </div>

    <div id="view" class="hidden">
      <div id="brandView" class="brand hidden"></div>
      <h1 id="name">Shared file</h1>
      <p class="sub" id="label"></p>
      <div class="preview hidden" id="preview"></div>
      <button id="download" type="button">Download</button>
      <div class="dlerr hidden" id="dlerr" role="alert"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var token = qs.get('token') || '';
      var $ = function (id) { return document.getElementById(id); };
      var gate = $('gate'), lock = $('lock'), view = $('view');
      var grant = '';
      var grantExpires = 0;
      // Where the API lives. Defaults to the standalone layout; a host that serves
      // this page from elsewhere (the WordPress plugin serves it out of wp-content,
      // with the API under /wp-json/…) sets window.__FM_API_BASE__ before this script
      // runs. Trailing slash trimmed so the paths below stay readable.
      // Keep this comment brand-free: the shell is deliberately unbranded so an
      // operator can white-label it, and a test asserts the served HTML says nothing.
      var API = String(window.__FM_API_BASE__ || '/api/fm').replace(/\/+$/, '');

      function fail(text) {
        lock.classList.add('hidden'); view.classList.add('hidden');
        gate.textContent = text; gate.classList.remove('hidden');
      }
      function show(el) { gate.classList.add('hidden'); el.classList.remove('hidden'); }
      function bytes(n) {
        if (!n && n !== 0) return '';
        var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
      }
      function when(ts) {
        if (!ts) return '';
        try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return ''; }
      }

      // `brand` is operator-supplied (paid module config), so logo_url/link_url
      // must be validated with a real URL parser (not a regex on the raw string —
      // logo_url/link_url may legitimately point at ANY http(s) host, unlike
      // preview_url which must match our own route allowlist) before ever
      // touching img.src/a.href, and color is re-checked against a strict hex
      // pattern before it reaches a CSS custom property.
      function safeHttpUrl(raw) {
        if (!raw) return '';
        try {
          var u = new URL(String(raw), location.href);
          return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
        } catch (e) { return ''; }
      }
      function renderBrand(el, brand) {
        el.innerHTML = '';
        if (!brand) { el.classList.add('hidden'); return; }

        var logo = safeHttpUrl(brand.logo_url);
        var link = safeHttpUrl(brand.link_url);
        var name = String(brand.name || '');
        var has = false;

        var container = document.createElement('span');
        if (logo) {
          var img = document.createElement('img');
          img.src = logo; img.alt = name;
          container.appendChild(img); has = true;
        }
        if (name) {
          var label = document.createElement('span');
          label.textContent = name;
          container.appendChild(label); has = true;
        }
        container.style.display = 'contents';

        if (link && has) {
          var a = document.createElement('a');
          a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.appendChild(container);
          el.appendChild(a);
        } else {
          el.appendChild(container);
        }

        if (brand.color && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(brand.color)) {
          document.documentElement.style.setProperty('--accent', brand.color);
        }
        el.classList.toggle('hidden', !has);
      }

      // A recipient re-enters the password after the grant (600s TTL) lapses — this
      // is the ONLY way back to the lock screen once unlocked, and it clears the
      // stale grant so a retried download can't replay it.
      function requireReauth(msg) {
        grant = ''; grantExpires = 0;
        view.classList.add('hidden');
        $('pw').value = '';
        $('lockmeta').textContent = msg || 'Your unlock expired — please enter the password again.';
        lock.classList.remove('hidden');
      }

      // The download route is stateful (it counts against max_downloads on every
      // successful hit, and on S3/R2 that hit's response IS a cross-origin 302 to a
      // presigned URL). That means it can only ever be called ONCE per click — a
      // separate "check" request would burn a second download for one click, and a
      // plain `fetch` that follows the redirect would need S3 to allow this origin
      // in its CORS policy, which isn't guaranteed. So the ONLY safe way to trigger
      // it is a real navigation. A hidden iframe gets us that, while keeping the
      // user on the card: our own error responses are always same-origin JSON with
      // no attachment header, so they land in the iframe's (readable) document; a
      // real file — local/sftp bytes or the followed S3 redirect — either downloads
      // without rendering into the frame or lands on a different origin, and either
      // way `contentDocument` access throws or comes back empty, which we treat as
      // success (nothing left to report — the browser's own download UI takes over).
      function startDownload(url) {
        var dl = $('download');
        var errBox = $('dlerr');
        var restoreText = dl.textContent;
        errBox.classList.add('hidden'); errBox.textContent = '';
        dl.disabled = true;

        var frame = document.createElement('iframe');
        frame.style.display = 'none';
        // Set src BEFORE inserting: an iframe appended with no src first loads
        // "about:blank" and fires its own load event, which would race with (and
        // often preempt) the real navigation's load event below.
        frame.src = url;
        var done = false;
        var timer = setTimeout(function () { finish(null, null); }, 6000);

        function finish(errText, errCode) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          if (frame.parentNode) { frame.parentNode.removeChild(frame); }

          if (!errText) { dl.disabled = false; dl.textContent = restoreText; return; }
          if (errCode === 'share_grant_invalid') { requireReauth(errText); return; }
          if (errCode === 'share_exhausted') {
            dl.disabled = true; dl.textContent = 'No downloads remaining';
          } else {
            dl.disabled = false; dl.textContent = restoreText;
          }
          errBox.textContent = errText; errBox.classList.remove('hidden');
        }

        frame.onload = function () {
          var errText = null, errCode = null;
          try {
            var doc = frame.contentDocument;
            var text = doc && doc.body ? doc.body.textContent : '';
            var j = text ? JSON.parse(text) : null;
            if (j && j.error) { errText = j.error; errCode = j.error_code || null; }
          } catch (e) { /* cross-origin redirect (S3) or real file bytes → success */ }
          finish(errText, errCode);
        };

        document.body.appendChild(frame);
      }

      if (!token) { fail('This link is missing its token.'); return; }

      fetch(API + '/share/info?token=' + encodeURIComponent(token))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok || !res.j || res.j.error) { fail((res.j && res.j.error) || 'This link is invalid or has expired.'); return; }
          render(res.j.data);
        })
        .catch(function () { fail('Could not load this link.'); });

      function render(info) {
        // A protected share sends nothing but {has_password, expires, brand} — no
        // name, no size, no preview — until the password is exchanged for a grant.
        if (info.has_password && !info.file) {
          renderBrand($('brandLock'), info.brand);
          show(lock);
          $('lockmeta').textContent = info.expires ? 'Expires ' + when(info.expires) : '';
          return;
        }
        renderBrand($('brandView'), info.brand);
        show(view);
        var f = (info.files && info.files[0]) || info.file || {};
        $('name').textContent = f.name || 'Shared file';
        $('label').textContent = info.label || '';
        if (!info.label) { $('label').classList.add('hidden'); }

        // Preview markup is chosen by `kind`, but WHETHER there's a preview at all
        // is the server's decision (preview_url is absent when it isn't allowed).
        // The URL must be one of OUR OWN routes: `iframe.src` executes a
        // `javascript:` value, and `brand` is the declared seam for future
        // module-supplied values, so never trust the string's scheme.
        var box = $('preview');
        box.innerHTML = '';
        var preview = /^\/api\/fm\/(img|share\/file)\?/.test(String(f.preview_url || '')) ? f.preview_url : '';
        if (preview && f.kind === 'image') {
          var img = document.createElement('img');
          img.src = preview; img.alt = f.name || '';
          box.appendChild(img); box.classList.remove('hidden');
        } else if (preview && f.kind === 'pdf') {
          var frame = document.createElement('iframe');
          frame.src = preview; frame.setAttribute('title', f.name || 'Preview');
          box.appendChild(frame); box.classList.remove('hidden');
        } else {
          box.classList.add('hidden');
        }

        var bits = [];
        if (f.size || f.size === 0) { bits.push(bytes(f.size)); }
        if (info.expires) { bits.push('Expires ' + when(info.expires)); }
        if (info.remaining !== null && info.remaining !== undefined) { bits.push(info.remaining + ' download(s) left'); }
        $('meta').textContent = bits.join(' · ');

        // The cap can already be at 0 on load (someone else used the last download
        // between this page loading for them and for you) — don't offer a button
        // that's guaranteed to fail.
        var dl = $('download');
        $('dlerr').classList.add('hidden'); $('dlerr').textContent = '';
        if (info.remaining === 0) {
          dl.disabled = true; dl.textContent = 'No downloads remaining';
        } else {
          dl.disabled = false; dl.textContent = 'Download';
        }

        dl.onclick = function () {
          // The grant (600s TTL) can lapse while the card just sits open — catch
          // that client-side instead of bouncing off a guaranteed server error.
          if (grant && grantExpires && (Date.now() / 1000) >= grantExpires) {
            requireReauth('Your unlock expired — please enter the password again.');
            return;
          }
          var url = API + '/share/file?token=' + encodeURIComponent(token) + '&dl=1';
          if (grant) { url += '&g=' + encodeURIComponent(grant); }
          startDownload(url);
        };
      }

      $('unlock').addEventListener('click', function () {
        var btn = $('unlock');
        btn.disabled = true;
        fetch(API + '/share/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: $('pw').value })
        })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.ok || !res.j || res.j.error) {
              // Never reveal the file on a failed attempt — just the error.
              $('lockmeta').textContent = (res.j && res.j.error) || 'Wrong password.';
              return;
            }
            grant = res.j.data.grant || '';
            grantExpires = Number(res.j.data.grant_expires) || 0;
            lock.classList.add('hidden');
            render(res.j.data);
          })
          .catch(function () { btn.disabled = false; $('lockmeta').textContent = 'Could not unlock this link.'; });
      });

      $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') { $('unlock').click(); } });
    })();
  </script>
</body>
</html>
