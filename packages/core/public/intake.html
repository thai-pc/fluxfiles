<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The token rides the URL: never leak it onward via Referer. -->
  <meta name="referrer" content="no-referrer">
  <title>Upload portal</title>
  <!-- Redirect stub. The recipient page now ships inside the intake module and is served at
       /api/fm/intake/page. The URL is relative so a subdirectory install keeps working; the
       query (?token=) and the fragment are carried over. Links issued before the move
       (/public/intake.html?token=...) keep working through this file. -->
  <script>location.replace('../api/fm/intake/page' + location.search + location.hash);</script>
</head>
<body>
  <noscript><p><a href="../api/fm/intake/page">Continue</a> (JavaScript is off: add your link's <code>?token=</code> to this address).</p></noscript>
</body>
</html>
