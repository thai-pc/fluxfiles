                    <span class="ff-meta-summary" x-show="!seoSectionExpanded" x-text="(metaForm.title || metaForm.alt_text || metaForm.caption) ? '(…)' : ''"></span>
                    <svg class="ff-accordion-chevron" :class="{ expanded: seoSectionExpanded }" width="12" height="12" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
                </button>
                <div class="ff-meta-form" x-show="seoSectionExpanded">
                    <div class="ff-meta-field">
                        <label x-text="t('metadata.title')"></label>
                        <input type="text" x-model="metaForm.title" @input="watchMeta()" :placeholder="t('metadata.title_hint')">
                    </div>
                    <div class="ff-meta-field">
                        <label x-text="t('metadata.alt_text')"></label>
                        <input type="text" x-model="metaForm.alt_text" @input="watchMeta()" :placeholder="t('metadata.alt_hint')">
                    </div>
                    <div class="ff-meta-field">
                        <label x-text="t('metadata.caption')"></label>
                        <textarea x-model="metaForm.caption" @input="watchMeta()" :placeholder="t('metadata.caption_hint')" rows="2"></textarea>
                    </div>
                    <div class="ff-meta-saving" x-show="metaSaving" x-text="t('metadata.saving')"></div>
                </div>
            </div>
        </div>

        <!-- AI Tags tab -->
        <div x-show="activeTab === 'ai' && detailFile" style="flex:1;">
            <div style="margin-bottom:8px;">
                <button class="ff-btn ff-btn-primary ff-btn-sm"
                        :disabled="aiTagging"
                        @click="aiTag()">
                    <span x-show="!aiTagging" x-text="t('ai.generate')"></span>
                    <span x-show="aiTagging" x-text="t('ai.analyzing')"></span>
                </button>
            </div>
            <div x-show="aiTags.length > 0" style="margin-bottom:8px;">
                <label style="font-size:13px;color:var(--color-text-tertiary);display:block;margin-bottom:5px;text-transform:uppercase;" x-text="t('ai.tags')"></label>
                <div style="display:flex;flex-wrap:wrap;gap:3px;">
                    <template x-for="(tag, idx) in aiTags" :key="idx">
                        <span class="ff-tag"><span x-text="tag"></span><button @click="removeTag(idx)">&times;</button></span>
                    </template>
                </div>
            </div>
            <div x-show="aiTags.length === 0 && !aiTagging" class="ff-empty" style="padding:16px 0;">
                <p x-text="t('ai.no_tags')"></p>
            </div>
            <div x-show="aiTagging" style="padding:16px 0;text-align:center;">
                <div class="ff-spinner"></div>
                <p style="margin-top:8px;font-size:14px;color:var(--color-text-tertiary);" x-text="t('ai.analyzing_image')"></p>
            </div>
        </div>

        <!-- Crop tab -->
        <div class="ff-crop-panel" x-show="activeTab === 'crop' && detailFile" style="flex:1;overflow-y:auto;">
            <div class="ff-crop-aspects">
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': cropAspect === null }" @click="setCropAspect(null)" x-text="t('crop.free')"></button>
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': cropAspect === '1:1' }" @click="setCropAspect('1:1')">1:1</button>
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': cropAspect === '4:3' }" @click="setCropAspect('4:3')">4:3</button>
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': cropAspect === '16:9' }" @click="setCropAspect('16:9')">16:9</button>
            </div>

            <div class="ff-crop-container"
                 x-ref="cropContainer"
                 @mousedown="cropMouseDown($event)"
                 @mousemove="cropMouseMove($event)"
                 @mouseup="cropMouseUp()"
                 @mouseleave="cropMouseUp()">
                <img x-ref="cropImage" :src="detailFile?.url" :alt="detailFile?.name" draggable="false" style="width:100%;display:block;user-select:none;">
                <div class="ff-crop-overlay" x-show="cropData.w > 0 && cropData.h > 0"></div>
                <div class="ff-crop-selection" x-show="cropData.w > 0 && cropData.h > 0" :style="cropStyle">
                    <div class="ff-crop-handle tl"></div><div class="ff-crop-handle tr"></div>
                    <div class="ff-crop-handle bl"></div><div class="ff-crop-handle br"></div>
                </div>
            </div>

            <div class="ff-crop-info" x-show="cropData.w > 0"><span x-text="cropInfo"></span></div>

            <div class="ff-crop-inputs">
                <div class="ff-crop-input-group"><label>X</label><input type="number" x-model.number="cropData.x" min="0" :max="_cropNatW"></div>
                <div class="ff-crop-input-group"><label>Y</label><input type="number" x-model.number="cropData.y" min="0" :max="_cropNatH"></div>
                <div class="ff-crop-input-group"><label>W</label><input type="number" x-model.number="cropData.w" min="1" :max="_cropNatW - cropData.x"></div>
                <div class="ff-crop-input-group"><label>H</label><input type="number" x-model.number="cropData.h" min="1" :max="_cropNatH - cropData.y"></div>
            </div>

            <div class="ff-crop-actions">
                <button class="ff-btn ff-btn-primary ff-btn-sm" :disabled="cropData.w <= 0 || cropData.h <= 0 || cropSaving" @click="saveCrop('replace')">
                    <span x-show="!cropSaving" x-text="t('crop.replace')"></span><span x-show="cropSaving" x-text="t('crop.saving')"></span>
                </button>
                <button class="ff-btn ff-btn-sm" :disabled="cropData.w <= 0 || cropData.h <= 0 || cropSaving" @click="saveCrop('copy')" x-text="t('crop.save_copy')"></button>
                <button class="ff-btn ff-btn-sm" @click="cancelCrop(); activeTab = 'info'" x-text="t('common.cancel')"></button>
            </div>
        </div>

        <!-- Watermark tab (drag-and-drop editor) -->
        <div class="ff-wm-panel" x-show="activeTab === 'watermark' && detailFile" style="flex:1;overflow-y:auto;">
            <div class="ff-wm-type">
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': wm.type === 'logo' }" @click="wm.type = 'logo'" x-text="t('watermark.logo')"></button>
                <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': wm.type === 'text' }" @click="wm.type = 'text'" x-text="t('watermark.text')"></button>
            </div>

            <!-- Drag canvas: image with a draggable, resizable watermark overlay -->
            <div class="ff-wm-stage" x-ref="wmStage" @mousemove="wmDragMove($event)" @mouseup="wmDragEnd()" @mouseleave="wmDragEnd()">
                <img :src="detailFile?.url" :alt="detailFile?.name" draggable="false" style="width:100%;display:block;user-select:none;">
                <!-- logo overlay (left/top clamped by width so it mirrors the server's
                     in-canvas clamp and never overflows the clipped stage) -->
                <div class="ff-wm-mark" x-show="wm.type === 'logo' && wm.logo"
                     :style="'left:'+(Math.min(wm.x, 1-wm.scale)*100)+'%;top:'+(Math.min(wm.y, 1-wm.scale)*100)+'%;width:'+(wm.scale*100)+'%;opacity:'+wm.opacity"
                     @mousedown.prevent="wmDragStart($event, false)">
                    <img :src="wm.logo" draggable="false" style="width:100%;display:block;pointer-events:none;">
                    <div class="ff-wm-handle" @mousedown.prevent.stop="wmDragStart($event, true)"></div>
                </div>
                <!-- text overlay -->
                <div class="ff-wm-mark ff-wm-text" x-show="wm.type === 'text' && wm.text"
                     :style="'left:'+(wm.x*100)+'%;top:'+(wm.y*100)+'%;opacity:'+wm.opacity+';color:'+wm.color+';font-size:'+wmTextPx+'px'"
                     @mousedown.prevent="wmDragStart($event, false)" x-text="wm.text"></div>
            </div>

            <div class="ff-wm-controls">
                <template x-if="wm.type === 'logo'">
                    <div class="ff-wm-row">
                        <label class="ff-btn ff-btn-sm" style="cursor:pointer">
                            <span x-text="t('watermark.upload_logo')"></span>
                            <input type="file" accept="image/png,image/webp,image/svg+xml" style="display:none" @change="wmLoadLogo($event)">
                        </label>
                        <div class="ff-wm-slider"><label x-text="t('watermark.size')"></label>
                            <input type="range" min="5" max="90" :value="Math.round(wm.scale*100)" @input="wm.scale = $event.target.value/100"></div>
                    </div>
                </template>
                <template x-if="wm.type === 'text'">
                    <div class="ff-wm-row">
                        <input type="text" class="ff-input" :placeholder="t('watermark.text_placeholder')" x-model="wm.text" style="flex:1">
                        <input type="color" x-model="wm.color" :title="t('watermark.color')">
                        <div class="ff-wm-slider"><label x-text="t('watermark.font_size')"></label>
                            <input type="range" min="8" max="120" x-model.number="wm.font_size"></div>
                    </div>
                </template>
                <div class="ff-wm-row">
                    <div class="ff-wm-slider" style="flex:1"><label x-text="t('watermark.opacity')"></label>
                        <input type="range" min="10" max="100" :value="Math.round(wm.opacity*100)" @input="wm.opacity = $event.target.value/100"></div>
                </div>
            </div>

            <div class="ff-crop-actions">
                <button class="ff-btn ff-btn-primary ff-btn-sm" :disabled="!wmReady || wmSaving" @click="saveWatermark('replace')">
                    <span x-show="!wmSaving" x-text="t('watermark.apply')"></span><span x-show="wmSaving" x-text="t('crop.saving')"></span>
                </button>
                <button class="ff-btn ff-btn-sm" :disabled="!wmReady || wmSaving" @click="saveWatermark('copy')" x-text="t('crop.save_copy')"></button>
                <button class="ff-btn ff-btn-sm" @click="activeTab = 'info'" x-text="t('common.cancel')"></button>
            </div>
        </div>
    </div>

    <!-- Preview lightbox (full-size image, zoomable) -->
    <div class="ff-preview-lightbox" x-show="previewFullscreen && detailFile && isPreviewable(detailFile, 'image')" x-transition.opacity
         @click="zoom.scale === 1 && closePreview()"
         @keydown.escape.window="previewFullscreen && (zoom.scale > 1 ? resetZoom() : closePreview())"
         @wheel.prevent="zoomWheel($event)"
         @mousemove="panMove($event)" @mouseup="endPan()" @mouseleave="endPan()">
        <img :src="detailFile?.url" :srcset="detailFile?.img_srcset"
             :sizes="detailFile?.img_srcset ? (detailFile?.img_sizes || '100vw') : null"
             :alt="detailFile?.name" draggable="false"
             class="ff-preview-img" :class="{ zoomed: zoom.scale > 1, dragging: zoom.dragging }"
             :style="'transform: translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.scale + ')'"
             @click.stop="zoomClick($event)" @dblclick.stop="zoomToggle($event)" @mousedown.stop="startPan($event)">
        <div class="ff-zoom-bar" @click.stop>
            <button class="ff-zoom-btn" @click="zoomStep(-0.5)" :disabled="zoom.scale <= 1" :title="t('zoom.out')" aria-label="zoom out">&minus;</button>
            <span class="ff-zoom-level" x-text="Math.round(zoom.scale * 100) + '%'"></span>
            <button class="ff-zoom-btn" @click="zoomStep(0.5)" :disabled="zoom.scale >= 5" :title="t('zoom.in')" aria-label="zoom in">+</button>
            <button class="ff-zoom-btn" @click="resetZoom()" :disabled="zoom.scale === 1" :title="t('zoom.reset')" aria-label="reset zoom">⟲</button>
        </div>
    </div>

    <!-- ═══ New folder modal ═══ -->
    <div class="ff-modal-overlay ff-new-folder-overlay" x-show="showNewFolder" x-transition @click.self="closeNewFolder()">
        <div class="ff-new-folder-modal" role="dialog" aria-modal="true" :aria-label="t('folder.create_title')" @keydown.escape.window="closeNewFolder()">
            <div class="ff-new-folder-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                </svg>
            </div>
            <h3 class="ff-new-folder-title" x-text="t('folder.create_title')"></h3>
            <p class="ff-new-folder-desc" x-text="t('folder.create_desc')"></p>
            <div class="ff-new-folder-field">
                <input type="text"
                       x-ref="newFolderInput"
                       x-model="newFolderName"
                       :placeholder="t('folder.name_placeholder')"
                       @keydown.enter.prevent="submitNewFolder()"
                       class="ff-new-folder-input"
                       :disabled="newFolderCreating">
                <p class="ff-new-folder-error" x-show="newFolderError" x-text="newFolderError"></p>
            </div>
            <div class="ff-new-folder-actions">
                <button class="ff-btn ff-btn-ghost" @click="closeNewFolder()" :disabled="newFolderCreating" x-text="t('common.cancel')"></button>
                <button class="ff-btn ff-btn-primary ff-new-folder-submit"
                        @click="submitNewFolder()"
                        :disabled="newFolderCreating || !newFolderName.trim()">
                    <span x-show="!newFolderCreating" x-text="t('folder.create')"></span>
                    <span x-show="newFolderCreating" style="display:inline-flex;align-items:center;gap:6px;">
                        <span class="ff-new-folder-spinner"></span>
                        <span x-text="t('common.loading')"></span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ Confirm dialog ═══ -->
    <div class="ff-confirm-overlay" x-show="showConfirm" x-transition @keydown.escape.window="showConfirm = false">
        <div class="ff-confirm-box" role="dialog" aria-modal="true">
            <h4 x-text="t('delete.confirm_title')"></h4>
            <p x-text="confirmMessage"></p>
            <div class="ff-confirm-actions">
                <button class="ff-btn" @click="showConfirm = false" x-text="t('common.cancel')"></button>
                <button class="ff-btn ff-btn-danger" @click="showConfirm = false; confirmAction && confirmAction()" x-text="t('common.delete')"></button>
            </div>
        </div>
    </div>

    <!-- ═══ Bulk move dialog ═══ -->
    <div class="ff-confirm-overlay" x-show="showBulkMove" x-transition @keydown.escape.window="showBulkMove = false">
        <div class="ff-confirm-box" role="dialog" aria-modal="true">
            <h4 x-text="t('bulk.move_to_folder')"></h4>
            <p x-text="t('file.items_selected', {count: selected.length}) + ' — ' + currentDisk.toUpperCase()"></p>
            <div class="ff-meta-field" style="margin:10px 0;">
                <label x-text="t('bulk.destination')"></label>
                <input type="text" x-model="bulkMoveTarget" placeholder="e.g. photos/2024">
            </div>
            <div x-show="folders.length > 0" style="margin-bottom:10px;">
                <label style="font-size:13px;color:var(--color-text-tertiary);display:block;margin-bottom:4px;text-transform:uppercase;" x-text="t('bulk.quick_pick')"></label>
                <div style="display:flex;flex-wrap:wrap;gap:3px;">
                    <template x-for="folder in folders" :key="folder.key">
                        <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': bulkMoveTarget === folder.key }" @click="bulkMoveTarget = folder.key" x-text="folder.name"></button>
                    </template>
                    <button class="ff-btn ff-btn-sm" :class="{ 'ff-btn-primary': bulkMoveTarget === '' }" @click="bulkMoveTarget = ''" x-text="t('common.root')"></button>
                </div>
            </div>
            <div class="ff-confirm-actions">
                <button class="ff-btn" @click="showBulkMove = false" x-text="t('common.cancel')"></button>
                <button class="ff-btn ff-btn-primary" @click="executeBulkMove()" x-text="t('common.move')"></button>
            </div>
        </div>
    </div>

    <!-- ═══ Cross-disk dialog ═══ -->
    <div class="ff-confirm-overlay" x-show="showCrossDisk" x-transition @keydown.escape.window="showCrossDisk = false">
        <div class="ff-confirm-box" role="dialog" aria-modal="true">
            <h4 x-text="crossDiskMode === 'copy' ? t('bulk.copy_to_disk') : t('bulk.move_to_disk')"></h4>
            <p x-text="t('file.items_selected', {count: selected.length}) + ' — ' + currentDisk.toUpperCase()"></p>
            <div class="ff-meta-field" style="margin:10px 0;">
                <label x-text="t('bulk.target_disk')"></label>
                <select x-model="crossDiskTarget" style="width:100%;padding:6px 10px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;">
                    <option value="" x-text="t('bulk.select_disk')"></option>
                    <template x-for="d in availableDisks" :key="d">
                        <option :value="d" x-text="d.toUpperCase()"></option>
                    </template>
                </select>
            </div>
            <div class="ff-meta-field" style="margin:10px 0;">
                <label x-text="t('bulk.destination')"></label>
                <input type="text" x-model="crossDiskPath" placeholder="e.g. photos/2024">
            </div>
            <div class="ff-confirm-actions">
                <button class="ff-btn" @click="cancelCrossDisk()" x-text="t('common.cancel')"></button>
                <button class="ff-btn ff-btn-primary" :disabled="!crossDiskTarget" @click="executeCrossDisk()" x-text="crossDiskMode === 'copy' ? t('common.copy') : t('common.move')"></button>
            </div>
        </div>
    </div>

    <!-- ═══ Rename modal ═══ -->
    <div class="ff-modal-overlay ff-new-folder-overlay" x-show="showRename" x-transition @click.self="closeRename()">
        <div class="ff-new-folder-modal" role="dialog" aria-modal="true" :aria-label="t('rename.title') || t('common.rename')" @keydown.escape.window="showRename && closeRename()">
            <div class="ff-new-folder-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                </svg>
            </div>
            <h3 class="ff-new-folder-title" x-text="t('rename.title')"></h3>
            <p class="ff-new-folder-desc" x-text="t('rename.description')"></p>
            <div class="ff-new-folder-field">
                <div class="ff-rename-row">
                    <input type="text"
                           x-ref="renameInput"
                           x-model="renameValue"
                           :placeholder="t('rename.placeholder')"
                           @keydown.enter.prevent="submitRename()"
                           class="ff-new-folder-input ff-rename-base"
                           :disabled="renameSubmitting">
                    <span class="ff-rename-ext" x-show="renameExt" x-text="renameExt" :title="t('rename.ext_locked')"></span>
                </div>
                <p class="ff-new-folder-error" x-show="renameError" x-text="renameError"></p>
            </div>
            <div class="ff-new-folder-actions">
                <button class="ff-btn ff-btn-ghost" @click="closeRename()" :disabled="renameSubmitting" x-text="t('common.cancel')"></button>
                <button class="ff-btn ff-btn-primary ff-new-folder-submit"
                        @click="submitRename()"
                        :disabled="renameSubmitting || !renameValue.trim()">
                    <span x-show="!renameSubmitting" x-text="t('common.rename')"></span>
                    <span x-show="renameSubmitting" style="display:inline-flex;align-items:center;gap:6px;">
                        <span class="ff-new-folder-spinner"></span>
                        <span x-text="t('common.loading')"></span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ Activity log (audit) panel ═══ -->
    <div class="ff-modal-overlay" x-show="showActivity" x-transition @click.self="closeActivity()" style="z-index:60;" x-cloak>
        <div class="ff-activity-modal" role="dialog" aria-modal="true" :aria-label="t('audit.title')" @keydown.escape.window="showActivity && closeActivity()">
            <div class="ff-activity-head">
                <h3 x-text="t('audit.title')"></h3>
                <button class="ff-activity-close" @click="closeActivity()" :aria-label="t('common.close')">&times;</button>
            </div>
            <p class="ff-activity-note" x-text="t('audit.note')"></p>
            <div class="ff-activity-filters">
                <input type="text" x-model="activityFilter.action" :placeholder="t('audit.filter_action')" @keydown.enter="loadActivity()">
                <input type="text" x-model="activityFilter.path" :placeholder="t('audit.filter_path')" @keydown.enter="loadActivity()">
                <input type="date" x-model="activityFilter.from" :title="t('audit.filter_from')">
                <input type="date" x-model="activityFilter.to" :title="t('audit.filter_to')">

    <!-- ═══ Storage usage dashboard ═══ -->
    <div class="ff-modal-overlay" x-show="showUsage" x-transition @click.self="closeUsage()" style="z-index:60;" x-cloak>
        <div class="ff-usage-modal" role="dialog" aria-modal="true" :aria-label="t('usage.title')" @keydown.escape.window="showUsage && closeUsage()">
            <div class="ff-activity-head">
                <h3 x-text="t('usage.title')"></h3>
                <button class="ff-activity-close" @click="closeUsage()" :aria-label="t('common.close')">&times;</button>
            </div>
            <div class="ff-activity-body">
                <p class="ff-new-folder-error" x-show="usageError" x-text="usageError"></p>
                <div x-show="usageLoading" class="ff-activity-state" x-text="t('common.loading')"></div>

                <!-- Edition / license banner -->
                <template x-if="licenseInfo">
                    <div class="ff-license-banner" :class="'is-' + (licenseInfo.status || 'free')">
                        <div class="ff-license-row">
                            <span class="ff-license-edition" x-text="t('license.edition.' + (licenseInfo.edition || 'free')) || (licenseInfo.edition || 'free')"></span>
                            <span class="ff-license-status" x-text="t('license.status.' + (licenseInfo.status || 'free'))"></span>
                        </div>
                        <div class="ff-license-note" x-show="licenseNeedsAttention">
                            <span x-show="licenseInfo.status === 'grace'" x-text="t('license.note.grace', { days: licenseInfo.days_left != null ? Math.max(0, licenseInfo.days_left) : 0 })"></span>
                            <span x-show="licenseInfo.status === 'expired'" x-text="t('license.note.expired')"></span>
                            <span x-show="licenseInfo.status === 'perpetual'" x-text="t('license.note.perpetual')"></span>
                        </div>
                        <div class="ff-license-note" x-show="licenseInfo.status === 'active' && licenseInfo.days_left != null && licenseInfo.days_left <= 30">
                            <span x-text="t('license.note.renew_soon', { days: licenseInfo.days_left })"></span>
                        </div>
                    </div>
                </template>

                <template x-if="!usageLoading && usageInfo">
                    <div class="ff-usage">
                        <!-- Quota meter + status -->
                        <div class="ff-usage-meter" :class="usageStatusClass">
                            <div class="ff-usage-meter-head">
                                <span x-text="formatSize(usageInfo.quota.used_bytes)"></span>
                                <span x-show="usageInfo.quota.limit_bytes" x-text="'/ ' + formatSize(usageInfo.quota.limit_bytes) + ' (' + usageInfo.quota.percent + '%)'"></span>
                            </div>
                            <div class="meter-bar"><div class="meter-fill" :style="'width:' + (usageInfo.quota.percent || 0) + '%'"></div></div>
                            <div class="ff-usage-meter-foot">
                                <span x-text="usageInfo.file_count + ' ' + t('usage.files')"></span>
                                <button class="ff-btn" @click="refreshUsage()" :disabled="!usageRefreshReady" x-text="t('usage.refresh')"></button>
                            </div>
                        </div>

                        <!-- Critical/warning banner -->
                        <template x-if="usageInfo.quota.status === 'critical'">
                            <div class="ff-usage-banner is-critical" x-text="t('usage.critical')"></div>
                        </template>
                        <template x-if="usageInfo.quota.status === 'warning'">
                            <div class="ff-usage-banner is-warning" x-text="t('usage.warning')"></div>
                        </template>

                        <!-- By type -->
                        <div class="ff-usage-section" x-show="usageInfo.by_type.length">
                            <h4 x-text="t('usage.by_type')"></h4>
                            <template x-for="row in usageInfo.by_type" :key="row.type">
                                <div class="ff-usage-row">
                                    <span class="ff-usage-row-label" x-text="usageTypeLabel(row.type)"></span>
                                    <div class="ff-usage-row-bar"><div class="ff-usage-row-fill" :style="'width:' + row.percent + '%'"></div></div>
                                    <span class="ff-usage-row-size" x-text="formatSize(row.size_bytes)"></span>
                                </div>
                            </template>
                        </div>

                        <!-- Top folders -->
                        <div class="ff-usage-section" x-show="usageInfo.top_folders.length">
                            <h4 x-text="t('usage.top_folders')"></h4>
                            <template x-for="f in usageInfo.top_folders" :key="f.path">
                                <button class="ff-usage-folder" @click="usageGoFolder(f.path)">
                                    <span class="ff-usage-folder-path" x-text="f.path"></span>
                                    <span class="ff-usage-folder-meta" x-text="formatSize(f.size_bytes) + ' · ' + f.count + ' ' + t('usage.files')"></span>
                                </button>
                            </template>
                        </div>

                        <!-- Optimization savings (paid module; /usage returns optimize stats).
                             x-if (not x-show) so the row isn't in the DOM when there are no
                             savings — keeps `.ff-usage-row` counts clean for other sections/tests. -->
                        <template x-if="usageInfo.optimize && usageInfo.optimize.total_saved_bytes > 0">
                            <div class="ff-usage-section">
                                <h4 x-text="t('optimize.savings')"></h4>
                                <div class="ff-usage-row">
                                    <span class="ff-usage-row-label" x-text="t('optimize.total_saved')"></span>
                                    <span style="margin-inline-start:auto; color:var(--color-text-secondary)"
                                          x-text="formatSize(usageInfo.optimize.total_saved_bytes) + ' · ' + usageInfo.optimize.files_optimized + ' ' + t('usage.files')"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>

                <div x-show="trashLoading" class="ff-activity-state" x-text="t('common.loading')"></div>
                <div x-show="!trashLoading && !trashError && trashEntries.length === 0" class="ff-activity-state" x-text="t('trash.empty_state')"></div>
                <table class="ff-activity-table" x-show="!trashLoading && trashEntries.length > 0">
                    <thead>
                        <tr>

    <!-- ═══ Import from URL modal ═══ -->
    <div class="ff-modal-overlay" x-show="showUrlImport" x-transition @click.self="closeUrlImport()" style="z-index:60;" x-cloak>
        <div class="ff-import-modal" role="dialog" aria-modal="true" :aria-label="t('import.title')" @keydown.escape.window="showUrlImport && closeUrlImport()">
            <div class="ff-activity-head">
                <h3 x-text="t('import.title')"></h3>
                <button class="ff-activity-close" @click="closeUrlImport()" :aria-label="t('common.close')">&times;</button>
            </div>
            <div class="ff-import-body">

                <template x-if="urlImportState === 'input' || urlImportState === 'error'">
                    <div>
                        <input class="ff-import-input" type="url" x-model="urlImportUrl"
                               :placeholder="t('import.placeholder')"
                               @keydown.enter="importUrl()" x-ref="urlImportInput" autofocus>
                        <p class="ff-import-hint" x-text="t('import.hint')"></p>
                        <p class="ff-import-error" x-show="urlImportState === 'error'" x-text="urlImportError"></p>

                            <button class="ff-btn ff-btn-primary" @click="importUrl()" :disabled="!urlImportUrl.trim()"

                            <button class="ff-btn ff-btn-primary" @click="closeUrlImport()" x-text="t('common.close')"></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

                </button>
                <div class="ff-sheet-divider"></div>
                <button class="ff-sheet-danger" @click="closeActionSheet(); selected = [mobileActionSheet]; confirmDelete()">
                    <svg width="18" height="18" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M4.5 3v6.5h3V3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.delete')"></span>
                </button>
            </div>
            <button class="ff-sheet-cancel" @click="closeActionSheet()" x-text="t('common.cancel')"></button>
        </div>
    </div>

    <!-- ═══ Toast notification ═══ -->
    <div class="ff-toast"
         :class="{ show: toastVisible, ['ff-toast-' + toastType]: true }"
         x-show="toastVisible"
         x-transition:enter="ff-toast-enter"
         x-transition:enter-start="ff-toast-enter-start"
         x-transition:enter-end="ff-toast-enter-end"
         x-transition:leave="ff-toast-leave"
         x-transition:leave-start="ff-toast-leave-start"
         x-transition:leave-end="ff-toast-leave-end"
         @click="toastVisible = false">
        <div class="ff-toast-icon">
            <template x-if="toastType === 'success'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </template>
            <template x-if="toastType === 'error'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </template>
            <template x-if="toastType === 'info'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </template>
        </div>
        <span class="ff-toast-text" x-text="toastMessage"></span>
    </div>

</div>
</body>
</html>
