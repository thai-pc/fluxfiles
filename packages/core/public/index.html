<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FluxFiles</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238957E5'/%3E%3Cpath d='M8 10a2 2 0 012-2h4l2 2h6a2 2 0 012 2v10a2 2 0 01-2 2H10a2 2 0 01-2-2V10z' fill='white' fill-opacity='0.9'/%3E%3Cpath d='M12 17l2.5-3 2 2 3.5-4' stroke='%238957E5' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <script>
        (function(){
            var t = typeof localStorage !== 'undefined' && localStorage.getItem('fluxfiles_theme');
            var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <link rel="stylesheet" href="../assets/fm.css">
    <script>window.__FM_LOCALE__ = window.__FM_LOCALE__ || { locale: 'en', dir: 'ltr', messages: {} };</script>
    <script defer src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js"
            integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
            crossorigin="anonymous"></script>
    <script src="../assets/fm.js"></script>
</head>
<body>
<!-- Alpine 3 auto-calls the component's init() method — do NOT add x-init="init()"
     here too, or init() runs twice (two message listeners → duplicate FM_CONFIG
     handling → doubled list/quota/lang requests). -->
<div class="ff-app" x-cloak :class="{ 'ff-sidebar-open': sidebarOpen, 'ff-picker-mode': config.mode === 'picker', 'ff-multiple-mode': config.multiple }" x-data="fluxFilesApp()"
     @fullscreenchange.document="syncFullscreen()" @webkitfullscreenchange.document="syncFullscreen()">

    <!-- ═══ i18n boot overlay ═══
         Covers the UI until translation messages are ready so raw i18n keys are
         never shown. Server-injected pages have messages on frame 1 (overlay is
         already hidden); only statically-served pages briefly show the spinner. -->
    <div class="ff-i18n-boot" x-show="!i18nReady" x-cloak>
        <div class="ff-i18n-boot-spinner"></div>
    </div>

    <!-- ═══ Auth required screen ═══ -->
    <div class="ff-auth-screen" x-show="authRequired" x-transition.opacity.duration.400ms>
        <div class="ff-auth-card">
            <!-- Animated logo icon -->
            <div class="ff-auth-icon">
                <svg viewBox="0 0 48 48" fill="none">
                    <rect x="4" y="4" width="40" height="40" rx="12" fill="var(--ff-primary)" opacity="0.08"/>
                    <rect x="8" y="8" width="32" height="32" rx="8" fill="var(--ff-primary)" opacity="0.15"/>
                    <path d="M16 19a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H18a2 2 0 01-2-2V19z" fill="var(--ff-primary)"/>
                    <path d="M20 25l2.5-3 2 2 3.5-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>

            <h2 class="ff-auth-title">FluxFiles</h2>

            <!-- State: refreshing — spinner while waiting for new token -->
            <template x-if="authState === 'refreshing'">
                <div style="text-align:center;">
                    <div class="ff-auth-spinner"></div>
                    <p class="ff-auth-subtitle" x-text="t('auth.refreshing') || 'Refreshing session...'"></p>
                </div>
            </template>

            <!-- State: expired — session could not be renewed -->
            <template x-if="authState === 'expired'">
                <div style="text-align:center;">
                    <p class="ff-auth-subtitle" x-text="t('auth.expired') || 'Your session has expired. Please reload or re-authenticate.'"></p>
                    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">
                        <button class="ff-btn ff-btn-primary" @click="window.parent !== window ? postMessage('FM_TOKEN_REFRESH', { reason: 'manual_retry' }) : location.reload()" x-text="t('auth.retry') || 'Retry'"></button>
                        <button class="ff-btn" @click="if(window.parent !== window) postMessage('FM_CLOSE', {})" x-show="window.parent !== window" x-text="t('auth.close') || 'Close'"></button>
                    </div>
                </div>
            </template>

            <!-- State: missing — no token provided (initial / standalone) -->
            <template x-if="authState === 'missing' || authState === 'ok'">
                <div>
                    <p class="ff-auth-subtitle">Authentication required to access the file manager.</p>

                    <div class="ff-auth-divider"></div>

                    <!-- Method cards -->
                    <div class="ff-auth-methods">
                        <div class="ff-auth-method">
                            <div class="ff-auth-method-icon">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M15 7H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2V9a2 2 0 00-2-2z"/>
                                    <path d="M7 7V5a3 3 0 016 0v2"/>
                                    <circle cx="10" cy="12" r="1"/>
                                </svg>
                            </div>
                            <div class="ff-auth-method-body">
                                <span class="ff-auth-method-label">URL Token</span>
                                <code class="ff-auth-code">?token=&lt;JWT&gt;</code>
                            </div>
                        </div>
                        <div class="ff-auth-method">
                            <div class="ff-auth-method-icon">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="4" width="16" height="12" rx="2"/>
                                    <path d="M6 8h8M6 11h5"/>
                                </svg>
                            </div>
                            <div class="ff-auth-method-body">
                                <span class="ff-auth-method-label">Iframe Embed</span>
                                <code class="ff-auth-code">postMessage FM_CONFIG</code>
                            </div>
                        </div>
                    </div>

                    <a class="ff-auth-docs" href="https://github.com/thai-pc/fluxfiles" target="_blank" rel="noopener">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                        View documentation
                    </a>
                </div>
            </template>
        </div>

        <!-- Subtle background pattern -->
        <div class="ff-auth-bg-pattern"></div>
    </div>

    <!-- ═══ Topbar ═══ -->
    <div class="ff-topbar" x-show="!authRequired">
        <!-- Mobile: hamburger -->
        <button class="ff-hamburger" @click="sidebarOpen = !sidebarOpen" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <span class="ff-logo">
            <svg class="ff-logo-icon" width="20" height="20" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect width="32" height="32" rx="7" fill="#8957E5"/>
                <path d="M8 10a2 2 0 012-2h4l2 2h6a2 2 0 012 2v10a2 2 0 01-2 2H10a2 2 0 01-2-2V10z" fill="#fff" fill-opacity="0.92"/>
                <path d="M12 17l2.5-3 2 2 3.5-4" stroke="#8957E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="ff-logo-text">FluxFiles</span>
        </span>
        <div class="ff-sep ff-sep-desktop"></div>

        <!-- Breadcrumb -->
        <div class="ff-breadcrumb">
            <template x-for="(crumb, idx) in breadcrumbs" :key="crumb.path">
                <span style="display:inline-flex;align-items:center;gap:4px;">
                    <span x-show="idx > 0" class="bc-sep">›</span>
                    <button @click="navigate(crumb.path)" :class="{ 'bc-active': idx === breadcrumbs.length - 1 }">
                        <svg x-show="idx === 0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span x-text="crumb.name"></span>
                    </button>
                </span>
            </template>
        </div>

        <!-- Mobile: search icon (opens fullscreen search) -->
        <button class="ff-mobile-search-btn" @click="mobileSearchOpen = true" :title="t('toolbar.search_hint')" :aria-label="t('toolbar.search_hint')">
            <svg width="16" height="16" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>

        <!-- Disk pills + controls (hidden on mobile, in sidebar) — Theme & Language above disk pills -->
        <div class="ff-disk-pills ff-disk-pills-desktop">
            <!-- Search -->
            <div class="ff-search-box">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                <input :placeholder="t('toolbar.search_hint')" x-model="searchQuery" @input="_scheduleSearch()">
            </div>
            <!-- Row 1: Theme + Language (above disk pills) -->
            <div class="ff-pills-actions">
                <div class="ff-locale-select" x-data="{ open: false }" @click.away="open = false">
                    <button class="ff-locale-btn" @click="open = !open" :title="t('toolbar.language') || 'Language'" :aria-label="t('toolbar.language') || 'Language'" aria-haspopup="listbox" :aria-expanded="open">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                        <span x-text="locale.toUpperCase()" style="font-size:11px;font-weight:600;min-width:18px;text-align:center;"></span>
                    </button>
                    <div class="ff-locale-dropdown" x-show="open" x-transition.scale.origin.top>
                        <template x-for="l in ['en','vi','zh','ja','ko','fr','de','es','ar','pt','it','ru','th','hi','tr','nl']" :key="l">
                            <button class="ff-locale-item" :class="{ active: locale === l }" @click="switchLocale(l); open = false" x-text="l.toUpperCase()"></button>
                        </template>
                    </div>
                </div>
                <button class="ff-theme-toggle-sm" @click="toggleTheme()" :title="t('toolbar.theme_toggle')" :aria-label="t('toolbar.theme_toggle')" :aria-pressed="isDark">
                    <span x-show="isDark">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </span>
                    <span x-show="!isDark">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    </span>
                </button>
                <button class="ff-theme-toggle-sm" x-show="canAudit" @click="openActivity()" :title="t('audit.title')" :aria-label="t('audit.title')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </button>
                <button class="ff-theme-toggle-sm" @click="openUsage()" :title="t('usage.title')" :aria-label="t('usage.title')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h5"/><path d="M18 3v6h-6"/><path d="M21 3l-9 9"/></svg>
                </button>
                <button class="ff-theme-toggle-sm" x-show="canDiagnose" @click="openDoctor()" :title="t('doctor.title')" :aria-label="t('doctor.title')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h4"/></svg>
                </button>
                <button class="ff-theme-toggle-sm" x-show="canManageTrash" @click="openTrash()" :title="t('trash.title')" :aria-label="t('trash.title')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6v14a2 2 0 002 2h8a2 2 0 002-2V6M10 11v6M14 11v6"/></svg>
                </button>
                <button class="ff-theme-toggle-sm" @click="toggleFullscreen()" :title="t('toolbar.fullscreen')" :aria-label="t('toolbar.fullscreen')" :aria-pressed="isFullscreen">
                    <svg x-show="!isFullscreen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>
                    <svg x-show="isFullscreen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 01-2 2H3M16 3v3a2 2 0 002 2h3M8 21v-3a2 2 0 00-2-2H3M16 21v-3a2 2 0 012-2h3"/></svg>
                </button>
            </div>
            <span class="ff-pills-sep"></span>
            <!-- Row 2: Disk pills -->
            <template x-for="disk in (config.disks || ['local'])" :key="disk">
                <button class="disk-pill"
                        :class="{ active: currentDisk === disk }"
                        @click="switchDisk(disk)">
                    <span class="dot"></span>
                    <span x-text="disk.toUpperCase()"></span>
                </button>
            </template>
        </div>
    </div>

    <!-- ═══ Mobile fullscreen search ═══ -->
    <div class="ff-mobile-search-overlay" x-show="mobileSearchOpen" x-transition.opacity.duration.200ms @keydown.escape.window="mobileSearchOpen = false"
         x-effect="if (mobileSearchOpen) $nextTick(() => $refs.mobileSearchInput?.focus())">
        <div class="ff-mobile-search-header">
            <svg width="16" height="16" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
            <input type="text" x-ref="mobileSearchInput" x-model="searchQuery" :placeholder="t('toolbar.search_hint')" @input="_scheduleSearch()" autofocus>
            <button @click="mobileSearchOpen = false; searchQuery = ''; loadFiles()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="ff-mobile-search-hint" x-show="!searchQuery" x-text="t('toolbar.search_hint')"></div>
    </div>

    <!-- Mobile sidebar overlay -->
    <div class="ff-sidebar-overlay" x-show="sidebarOpen" x-transition.opacity @click="sidebarOpen = false" @touchmove.prevent></div>

    <!-- ═══ Sidebar ═══ -->
    <div class="ff-sidebar" :class="{ 'ff-sidebar-open': sidebarOpen }" x-show="!authRequired">
        <!-- Mobile: Theme + Language above disk pills -->
        <div class="ff-disk-pills-mobile">
            <div class="ff-pills-actions">
                <div class="ff-locale-select" x-data="{ open: false }" @click.away="open = false">
                    <button class="ff-locale-btn" @click="open = !open">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                        <span x-text="locale.toUpperCase()" style="font-size:10px;font-weight:600;"></span>
                    </button>
                    <div class="ff-locale-dropdown" x-show="open" x-transition.scale.origin.top>
                        <template x-for="l in ['en','vi','zh','ja','ko','fr','de','es','ar','pt','it','ru','th','hi','tr','nl']" :key="l">
                            <button class="ff-locale-item" :class="{ active: locale === l }" @click="switchLocale(l); open = false" x-text="l.toUpperCase()"></button>
                        </template>
                    </div>
                </div>
                <button class="ff-theme-toggle-sm" @click="toggleTheme()">
                    <span x-show="isDark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
                    <span x-show="!isDark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
                </button>
            </div>
            <template x-for="disk in (config.disks || ['local'])" :key="disk">
                <button class="disk-pill"
                        :class="{ active: currentDisk === disk }"
                        @click="switchDisk(disk)">
                    <span class="dot"></span>
                    <span x-text="disk.toUpperCase()"></span>
                </button>
            </template>
            <span style="flex-grow:1"></span>
        </div>
        <!-- Folders section: lazy expand/collapse tree, drag a file/folder onto a node to move it -->
        <div class="ff-sidebar-section">
            <div class="ff-sidebar-label" x-text="t('sidebar.folders')"></div>

            <!-- Root (also a drop target) -->
            <button class="tree-item tree-node"
                    :class="{ active: currentPath === '', 'drop-target': dropTarget === '' }"
                    @click="navigate('')"
                    @dragover="onFolderDragOver('', $event)"
                    @dragleave="onFolderDragLeave('')"
                    @drop="onFolderDrop('', $event)">
                <span class="tree-spacer"></span>
                <span class="ti-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
                </span>
                <span class="ti-label" x-text="t('common.root')"></span>
                <span class="count" x-text="files.length + folders.length" x-show="currentPath === ''"></span>
            </button>

            <!-- Lazy tree: every expanded node's children, flattened with a depth indent -->
            <template x-for="node in flatTree" :key="node.key">
                <button class="tree-item tree-node"
                        :class="{ active: node.key === currentPath, 'drop-target': dropTarget === node.key }"
                        :style="'padding-inline-start:' + (8 + node.depth * 16) + 'px'"
                        @click="navigate(node.key)" :title="node.name"
                        @dragover="onFolderDragOver(node.key, $event)"
                        @dragleave="onFolderDragLeave(node.key)"
                        @drop="onFolderDrop(node.key, $event)">
                    <!-- chevron toggles expand/collapse without navigating -->
                    <span class="tree-toggle" x-show="node.hasChildren" @click.stop="toggleDir(node.key)"
                          :aria-label="node.expanded ? t('common.collapse') : t('common.expand')">
                        <svg class="chev" :class="{ open: node.expanded }" x-show="!node.loading" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 1.5L6.5 5L3 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="tree-spin" x-show="node.loading"></span>
                    </span>
                    <span class="tree-spacer" x-show="!node.hasChildren"></span>
                    <span class="ti-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    </span>
                    <span class="ti-label" x-text="node.name"></span>
                </button>
            </template>
        </div>

        <!-- Storage meter -->
        <div class="ff-storage-meter" x-show="quotaInfo">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <span x-text="t('quota.storage')"></span>
                <span x-text="quotaLabel"></span>
            </div>
            <div class="meter-bar">
                <div class="meter-fill" :style="'width:' + quotaPercent + '%'"></div>
            </div>
        </div>
    </div>

    <!-- ═══ Main area ═══ -->
    <div class="ff-main" x-show="!authRequired">

        <!-- Toolbar -->
        <div class="ff-toolbar">
            <button class="tb-btn primary" @click="triggerUpload()">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 4l3-3 3 3M2 10h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span x-text="t('toolbar.upload')"></span>
            </button>
            <button class="tb-btn" @click="createFolder()">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 3.5A1.5 1.5 0 012.5 2h2l1 1.5h4A1.5 1.5 0 0111 5v4A1.5 1.5 0 019.5 10.5h-7A1.5 1.5 0 011 9V3.5z" stroke="currentColor" stroke-width="1.1"/><path d="M6 6v3M4.5 7.5h3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                <span x-text="t('toolbar.new_folder')"></span>
            </button>
            <button class="tb-btn" x-show="canImport" @click="openUrlImport()" :title="t('import.title')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>
                <span x-text="t('import.button')"></span>
            </button>

            <div class="ff-sep ff-sep-desktop"></div>

            <!-- Contextual bulk buttons (desktop only) -->
            <div class="ff-toolbar-context">
                <button class="tb-btn" x-show="selected.length === 1" @click="openRename(selected[0])">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5l2 2-7 7H1.5V8.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.rename')"></span>
                </button>
                <button class="tb-btn danger" x-show="selected.length > 0" @click="confirmDelete()">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M4.5 3v6.5h3V3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.delete')"></span>
                    <span x-show="selected.length > 1" x-text="'(' + selected.length + ')'"></span>
                </button>
                <button class="tb-btn" x-show="selected.length === 1 && detailFile" @click="copyUrl(detailFile)">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 4.5a2.1 2.1 0 010 3l-1.5 1.5a2.1 2.1 0 01-3-3l.75-.75M4.5 7.5a2.1 2.1 0 010-3L6 3a2.1 2.1 0 013 3l-.75.75" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('toolbar.copy_url')"></span>
                </button>

                <!-- Select multiple (picker mode, multiple: true) -->
                <button class="tb-btn primary" x-show="config.multiple && selected.length > 0" @click="selectMultiple()">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 7l2 2 3-3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.1"/></svg>
                    <span x-text="tp('common.select_item', 'common.select_items', selected.length)"></span>
                </button>

                <!-- Bulk operations -->
                <button class="tb-btn" x-show="selected.length > 0" @click="openBulkMove()">
                    <span x-text="t('bulk.move')"></span>
                </button>
                <button class="tb-btn" x-show="selected.length > 0" @click="openCrossDisk('copy')">
                    <span x-text="t('bulk.copy_to_disk')"></span>
                </button>
                <button class="tb-btn" x-show="showBulkDownload" @click="bulkDownload()">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v5M3.5 4.5L6 7l2.5-2.5M2.5 9.5h7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.download')"></span>
                </button>
                <button class="tb-btn" x-show="showBulkZip" :disabled="zipBusy"
                        @click="downloadZip(selected.map(s => s.key), selected.length === 1 ? selected[0].name : null)">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="1.5" width="7" height="9" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M5 2.5h1.2M5 4h1.2M5 5.5h1.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('zip.download')"></span>
                </button>
                <button class="tb-btn" x-show="showBulkOptimize" :disabled="optimizeBusy"
                        @click="optimizeFiles(selected.map(s => s.key))">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v2M6 8.5v2M1.5 6h2M8.5 6h2M3 3l1.2 1.2M7.8 7.8L9 9M9 3L7.8 4.2M4.2 7.8L3 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('optimize.title')"></span>
                </button>
            </div>

            <!-- Mobile: "More" menu (3 dots) -->
            <div class="ff-mobile-more" x-data="{ open: false }" @click.away="open = false">
                <button class="tb-btn ff-more-btn" @click="open = !open">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                </button>
                <div class="ff-more-menu" x-show="open" x-transition.scale.origin.top.right>
                    <!-- Always-visible actions -->
                    <button @click="open = false; view = view === 'grid' ? 'list' : 'grid'">
                        <template x-if="view === 'grid'">
                            <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 3h10M1 6h10M1 9h10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                        </template>
                        <template x-if="view === 'list'">
                            <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="7" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="1" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="7" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/></svg>
                        </template>
                        <span x-text="view === 'grid' ? t('toolbar.list_view') : t('toolbar.grid_view')"></span>
                    </button>
                    <button @click="open = false; loadFiles()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                        <span x-text="t('common.refresh') || 'Refresh'"></span>
                    </button>
                    <div class="ff-more-divider"></div>
                    <!-- Sort cycle: name → date → size → type → name -->
                    <button @click="open = false; setSort(sortBy === 'name' ? 'date' : sortBy === 'date' ? 'size' : sortBy === 'size' ? 'type' : 'name')">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M3 2v8M1.5 4L3 2l1.5 2M9 10V2M7.5 8L9 10l1.5-2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="(t('sort.label') || 'Sort') + ': ' + sortLabel + ' ' + (sortDir === 'asc' ? '↑' : '↓')"></span>
                    </button>
                    <!-- Filter cycle: all → image → video → audio → document → other → all -->
                    <button @click="open = false; setTypeFilter(typeFilter === 'all' ? 'image' : typeFilter === 'image' ? 'video' : typeFilter === 'video' ? 'audio' : typeFilter === 'audio' ? 'document' : typeFilter === 'document' ? 'other' : 'all')">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 2h10L7 7v3L5 11V7z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="(t('filter.label') || 'Filter') + ': ' + typeFilterLabel"></span>
                    </button>
                    <!-- Selection-dependent actions -->
                    <div class="ff-more-divider" x-show="selected.length > 0"></div>
                    <button @click="open = false; openRename(selected[0])" x-show="selected.length === 1">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5l2 2-7 7H1.5V8.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="t('common.rename')"></span>
                    </button>
                    <button @click="open = false; copyUrl(detailFile)" x-show="selected.length === 1 && detailFile">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M7.5 4.5a2.1 2.1 0 010 3l-1.5 1.5a2.1 2.1 0 01-3-3l.75-.75M4.5 7.5a2.1 2.1 0 010-3L6 3a2.1 2.1 0 013 3l-.75.75" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                        <span x-text="t('toolbar.copy_url')"></span>
                    </button>
                    <button @click="open = false; openBulkMove()" x-show="selected.length > 0">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M1 3.5A1.5 1.5 0 012.5 2h2l1 1.5h4A1.5 1.5 0 0111 5v4A1.5 1.5 0 019.5 10.5h-7A1.5 1.5 0 011 9V3.5z" stroke="currentColor" stroke-width="1.1"/></svg>
                        <span x-text="t('bulk.move')"></span>
                    </button>
                    <button @click="open = false; openCrossDisk('copy')" x-show="selected.length > 0">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><rect x="2" y="4" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M5 4V3a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H8" stroke="currentColor" stroke-width="1.1"/></svg>
                        <span x-text="t('bulk.copy_to_disk')"></span>
                    </button>
                    <button @click="open = false; bulkDownload()" x-show="selected.length > 0">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v5M3.5 4.5L6 7l2.5-2.5M2.5 9.5h7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="t('common.download')"></span>
                    </button>
                    <div class="ff-more-divider" x-show="selected.length > 0"></div>
                    <button @click="open = false; confirmDelete()" x-show="selected.length > 0" class="ff-more-danger">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M4.5 3v6.5h3V3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="t('common.delete')"></span>
                    </button>
                </div>
            </div>

            <div style="margin-inline-start:auto;display:flex;align-items:center;gap:6px;">
                <!-- Type filter -->
                <div class="ff-dropdown ff-filter-dd" @click.away="filterMenuOpen = false">
                    <button class="tb-btn ff-dd-btn"
                            :class="{ active: typeFilter !== 'all' }"
                            @click="filterMenuOpen = !filterMenuOpen; sortMenuOpen = false"
                            :title="t('filter.label') || 'Filter'">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 2h10L7 7v3L5 11V7z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="typeFilterLabel"></span>
                        <svg width="8" height="8" viewBox="0 0 8 8" fill="none" style="opacity:.6"><path d="M1.5 3l2.5 2.5L6.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="ff-dd-menu" x-show="filterMenuOpen" x-transition.scale.origin.top.right>
                        <button @click="setTypeFilter('all')" :class="{ active: typeFilter === 'all' }">
                            <span x-text="t('filter.all') || 'All'"></span>
                        </button>
                        <button @click="setTypeFilter('image')" :class="{ active: typeFilter === 'image' }">
                            <span aria-hidden="true">🖼</span>
                            <span x-text="t('filter.image') || 'Images'"></span>
                        </button>
                        <button @click="setTypeFilter('video')" :class="{ active: typeFilter === 'video' }">
                            <span aria-hidden="true">🎬</span>
                            <span x-text="t('filter.video') || 'Videos'"></span>
                        </button>
                        <button @click="setTypeFilter('audio')" :class="{ active: typeFilter === 'audio' }">
                            <span aria-hidden="true">🎵</span>
                            <span x-text="t('filter.audio') || 'Audio'"></span>
                        </button>
                        <button @click="setTypeFilter('document')" :class="{ active: typeFilter === 'document' }">
                            <span aria-hidden="true">📄</span>
                            <span x-text="t('filter.document') || 'Documents'"></span>
                        </button>
                        <button @click="setTypeFilter('other')" :class="{ active: typeFilter === 'other' }">
                            <span aria-hidden="true">📝</span>
                            <span x-text="t('filter.other') || 'Other'"></span>
                        </button>
                    </div>
                </div>

                <!-- Sort -->
                <div class="ff-dropdown ff-sort-dd" @click.away="sortMenuOpen = false">
                    <button class="tb-btn ff-dd-btn"
                            @click="sortMenuOpen = !sortMenuOpen; filterMenuOpen = false"
                            :title="t('sort.label') || 'Sort'">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 2v8M1.5 4L3 2l1.5 2M9 10V2M7.5 8L9 10l1.5-2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span x-text="sortLabel"></span>
                        <span class="ff-sort-dir" :title="sortDir === 'asc' ? (t('sort.ascending') || 'Ascending') : (t('sort.descending') || 'Descending')">
                            <template x-if="sortDir === 'asc'">
                                <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M4 1.5v5M2 3.5L4 1.5l2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </template>
                            <template x-if="sortDir === 'desc'">
                                <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M4 6.5v-5M2 4.5L4 6.5l2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </template>
                        </span>
                    </button>
                    <div class="ff-dd-menu" x-show="sortMenuOpen" x-transition.scale.origin.top.right>
                        <button @click="setSort('name')" :class="{ active: sortBy === 'name' }">
                            <span x-text="t('sort.name') || 'Name'"></span>
                            <span class="ff-dd-mark" x-show="sortBy === 'name'" x-text="sortDir === 'asc' ? '↑' : '↓'"></span>
                        </button>
                        <button @click="setSort('date')" :class="{ active: sortBy === 'date' }">
                            <span x-text="t('sort.date') || 'Date'"></span>
                            <span class="ff-dd-mark" x-show="sortBy === 'date'" x-text="sortDir === 'asc' ? '↑' : '↓'"></span>
                        </button>
                        <button @click="setSort('size')" :class="{ active: sortBy === 'size' }">
                            <span x-text="t('sort.size') || 'Size'"></span>
                            <span class="ff-dd-mark" x-show="sortBy === 'size'" x-text="sortDir === 'asc' ? '↑' : '↓'"></span>
                        </button>
                        <button @click="setSort('type')" :class="{ active: sortBy === 'type' }">
                            <span x-text="t('sort.type') || 'Type'"></span>
                            <span class="ff-dd-mark" x-show="sortBy === 'type'" x-text="sortDir === 'asc' ? '↑' : '↓'"></span>
                        </button>
                        <div class="ff-dd-divider"></div>
                        <button @click="sortDir = (sortDir === 'asc' ? 'desc' : 'asc'); sortMenuOpen = false">
                            <span x-text="sortDir === 'asc' ? (t('sort.descending') || 'Descending') : (t('sort.ascending') || 'Ascending')"></span>
                        </button>
                    </div>
                </div>

                <!-- View toggle -->
                <div class="view-toggle">
                    <button :class="{ active: view === 'grid' }" @click="view = 'grid'" :title="t('toolbar.grid_view')" :aria-label="t('toolbar.grid_view')" :aria-pressed="view === 'grid'">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="7" y="1" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="1" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/><rect x="7" y="7" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button :class="{ active: view === 'list' }" @click="view = 'list'" :title="t('toolbar.list_view')" :aria-label="t('toolbar.list_view')" :aria-pressed="view === 'list'">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 3h10M1 6h10M1 9h10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Content area -->
        <div class="ff-content">

            <!-- Drop zone -->
            <div class="ff-dropzone"
                 :class="{ active: dragActive }"
                 @click="triggerUpload()"
                 @dragover.prevent="dragActive = true"
                 @dragleave.prevent="dragActive = false"
                 @drop="handleDrop($event)">
                <input type="file" x-ref="fileInput" multiple @change="handleFileInput($event)">
                <template x-if="!uploading">
                    <div>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="opacity:.5"><path d="M10 3v10M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <div style="font-size:13px;color:var(--color-text-secondary);" x-text="t('upload.drop_hint')"></div>
                        <div style="font-size:11px;color:var(--color-text-tertiary);margin-top:4px;" x-text="t('upload.max_size', {size: '10MB'})"></div>
                    </div>
                </template>
                <template x-if="uploading">
                    <div class="ff-upload-bar ff-upload-progress" style="background:transparent;color:inherit;">
                        <span class="ff-upload-spinner"></span>
                        <div class="ff-upload-info">
                            <div class="ff-upload-line">
                                <span class="ff-upload-label" x-text="uploadPhase === 'processing' ? t('common.loading') : t('upload.uploading')"></span>
                                <span class="ff-upload-name" x-show="uploadCurrentName" x-text="uploadCurrentName" :title="uploadCurrentName"></span>
                                <span class="ff-upload-count" x-show="uploadTotal > 1" x-text="'(' + uploadCurrentIndex + '/' + uploadTotal + ')'"></span>
                                <span class="ff-upload-pct" x-text="uploadProgress + '%'"></span>
                            </div>
                            <div class="progress-bar-wrap"><div class="progress-bar" :style="'width:' + uploadProgress + '%'"></div></div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Bulk progress -->
            <div class="ff-bulk-bar ff-bulk-progress-bar" x-show="bulkBusy" style="margin-bottom:8px;">
                <span x-text="bulkAction + '... ' + bulkDone + '/' + bulkTotal"></span>
                <div class="progress-bar-wrap" style="flex:1;margin-inline-start:8px;">
                    <div class="progress-bar" :style="'width:' + bulkProgress + '%'"></div>
                </div>
                <span x-text="bulkProgress + '%'" style="margin-inline-start:8px;font-size:13px;"></span>
            </div>

            <!-- Load error — persistent + retry, so a failed load isn't mistaken for an empty folder -->
            <div class="ff-load-error" x-show="loadError && !loading" x-cloak>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
                <p class="fle-title" x-text="t('error.load_failed') || 'Could not load this folder'"></p>
                <p class="fle-detail" x-text="loadError"></p>
                <button class="ff-empty-cta" @click="retryLoad()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    <span x-text="t('common.retry') || 'Retry'"></span>
                </button>
            </div>

            <!-- Loading skeleton (shimmer placeholders instead of a blank flash) -->
            <div class="ff-skeleton-grid" x-show="loading" x-cloak>
                <template x-for="i in 10" :key="i">
                    <div class="skel-card">
                        <div class="skel-thumb"></div>
                        <div class="skel-line"></div>
                        <div class="skel-line short"></div>
                    </div>
                </template>
            </div>

            <!-- File content -->
            <template x-if="!loading && !loadError">
                <div>
                    <!-- Global search results (across disk) -->
                    <template x-if="searchQuery && searchQuery.trim().length >= 2 && searchResults !== null">
                        <div>
                            <div class="section-label">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5" cy="5" r="3.5" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.5 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                                <span x-text="t('search.results', { query: searchQuery, count: (searchResults || []).length + (searchFolderResults || []).length }) || ('Search results')"></span>
                                <span style="font-weight:400;color:var(--color-text-tertiary);" x-show="searching" x-text="t('common.loading') || 'Loading…'"></span>
                            </div>

                            <div class="ff-empty" x-show="!searching && searchError">
                                <p x-text="searchError"></p>
                            </div>

                            <div class="ff-empty" x-show="!searching && !searchError && (searchResults || []).length === 0 && (searchFolderResults || []).length === 0">
                                <p x-text="t('search.no_results', { query: searchQuery }) || 'No results'"></p>
                            </div>

                            <!-- Folders -->
                            <template x-if="(searchFolderResults || []).length > 0">
                                <div style="margin-bottom:8px;">
                                    <div class="section-label">
                                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 2.5A1.5 1.5 0 012.5 1h2l1 1.5h4A1.5 1.5 0 0111 4v5A1.5 1.5 0 019.5 10.5h-7A1.5 1.5 0 011 9V2.5z" stroke="currentColor" stroke-width="1"/></svg>
                                        <span x-text="t('sidebar.folders')"></span>
                                        <span style="font-weight:400;color:var(--color-text-tertiary);" x-text="'(' + (searchFolderResults || []).length + ')'"></span>
                                    </div>
                                    <div class="file-grid list-view">
                                        <template x-for="row in sortedSearchFolders" :key="row.dir_key || row.key">
                                            <div class="file-card" @click="openSearchFolder(row)">
                                                <div class="thumb thumb-folder ff-thumb-icon">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                                                </div>
                                                <div class="fname" x-text="row.name || (row.dir_key || row.key || '').split('/').pop()" :title="row.dir_key || row.key"></div>
                                                <div class="fsize" x-text="row.dir_key || row.key"></div>
                                                <div class="fdate" x-text="formatDate(row.created || row.modified)"></div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Files -->
                            <template x-if="(searchResults || []).length > 0">
                                <div>
                                    <div class="section-label" style="margin-top:8px;">
                                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1"/><path d="M1 8l3-3 2 2 2-2 3 3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="4" r="1" fill="currentColor"/></svg>
                                        <span x-text="t('file.files')"></span>
                                        <span style="font-weight:400;color:var(--color-text-tertiary);" x-text="'(' + (searchResults || []).length + ')'"></span>
                                    </div>
                                    <div class="file-grid list-view">
                                        <template x-for="row in sortedSearchResults" :key="row.file_key || row.key">
                                            <div class="file-card" @click="openSearchResult(row)">
                                                <div class="thumb ff-thumb-icon thumb-file">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                                                </div>
                                                <div class="fname" x-text="(row.file_key || row.key || '').split('/').pop()" :title="row.file_key || row.key"></div>
                                                <div class="fsize" x-text="row.file_key || row.key"></div>
                                                <div class="fdate" x-text="formatDate(row.created || row.modified)"></div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Folders -->
                    <template x-if="(searchResults === null) && filteredFolders.length > 0">
                        <div>
                            <div class="section-label">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 2.5A1.5 1.5 0 012.5 1h2l1 1.5h4A1.5 1.5 0 0111 4v5A1.5 1.5 0 019.5 10.5h-7A1.5 1.5 0 011 9V2.5z" stroke="currentColor" stroke-width="1"/></svg>
                                <span x-text="t('sidebar.folders')"></span>
                            </div>
                            <div class="file-grid" :class="{ 'list-view': view === 'list' }">
                                <template x-for="folder in filteredFolders" :key="folder.key">
                                    <div class="file-card"
                                         :class="{ selected: isSelected(folder), 'drop-target': dropTarget === folder.key, dragging: dragItem && dragItem.key === folder.key }"
                                         draggable="true"
                                         @dragstart="onItemDragStart(folder, $event)"
                                         @dragend="onItemDragEnd()"
                                         @dragover="onFolderDragOver(folder.key, $event)"
                                         @dragleave="onFolderDragLeave(folder.key)"
                                         @drop="onFolderDrop(folder.key, $event)"
                                         @click="toggleFolderSelect(folder, $event)"
                                         @dblclick="navigate(folder.key)"
                                         @contextmenu.prevent="folderContextMenu(folder, $event)">
                                        <div class="check" x-show="config.multiple" @click.stop="toggleFolderSelect(folder, { ctrlKey: true })">✓</div>
                                        <div class="thumb thumb-folder ff-thumb-icon">
                                            <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                                        </div>
                                        <div class="fname" x-text="folder.name" :title="folder.name"></div>
                                        <div class="fsize" x-text="t('file.folder')"></div>
                                        <div class="fdate" x-text="formatDate(folder.created || folder.modified)"></div>
                                        <button class="ff-folder-delete"
                                                @click.stop="selected = [folder]; confirmDelete()"
                                                :title="t('common.delete')">
                                            <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M4.5 3v6.5h3V3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Files -->
                    <template x-if="(searchResults === null) && filteredFiles.length > 0">
                        <div>
                            <div class="section-label" style="margin-top:8px;">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1"/><path d="M1 8l3-3 2 2 2-2 3 3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="4" r="1" fill="currentColor"/></svg>
                                <span x-text="t('file.files')"></span>
                                <span style="font-weight:400;color:var(--color-text-tertiary);" x-text="'(' + filteredFiles.length + ')'"></span>
                            </div>
                            <div class="file-grid" :class="{ 'list-view': view === 'list' }">
                                <template x-for="file in filteredFiles" :key="file.key">
                                    <div class="file-card"
                                         :class="{ selected: isSelected(file), dragging: dragItem && dragItem.key === file.key }"
                                         draggable="true"
                                         @dragstart="onItemDragStart(file, $event)"
                                         @dragend="onItemDragEnd()"
                                         @click="handleFileClick(file, $event)"
                                         @dblclick="selectFile(file)"
                                         @contextmenu.prevent="openActionSheet(file)">
                                        <div class="check" x-show="config.multiple" @click.stop="toggleSelect(file, { ctrlKey: true })">✓</div>
                                        <div x-show="hasMetaBadge(file)" class="ff-meta-badge"></div>

                                        <!-- Thumbnail -->
                                        <template x-if="isPreviewable(file, 'image') && previewUrl(file, 'thumb')">
                                            <div class="thumb thumb-img">
                                                <img :src="previewUrl(file, 'thumb')" :alt="file.name" loading="lazy">
                                            </div>
                                        </template>
                                        <template x-if="!isPreviewable(file, 'image') || !previewUrl(file, 'thumb')">
                                            <div class="thumb ff-thumb-icon" :class="thumbClass(file)">
                                                <template x-if="fileIcon(file) === 'folder'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                                                </template>
                                                <template x-if="fileIcon(file) === 'video'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                                                </template>
                                                <template x-if="fileIcon(file) === 'audio'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                                                </template>
                                                <template x-if="fileIcon(file) === 'document'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                                </template>
                                                <template x-if="fileIcon(file) === 'image'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                                </template>
                                                <template x-if="fileIcon(file) === 'file'">
                                                    <svg class="ff-thumb-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                                                </template>
                                            </div>
                                        </template>

                                        <div class="fname" x-text="file.name" :title="file.name"></div>
                                        <div class="fsize" x-text="formatSize(file.size)"></div>
                                        <div class="fdate" x-text="formatDate(file.created || file.modified)"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Load more (pagination) -->
                    <div class="ff-load-more" x-show="(searchResults === null) && listCursor">
                        <button type="button" @click="loadMoreFiles()" :disabled="loadingMore">
                            <span x-show="!loadingMore" x-text="t('pagination.load_more', { count: Math.max(0, listTotal - (folders.length + files.length)) })"></span>
                            <span x-show="loadingMore" x-text="t('pagination.loading_more') || 'Loading…'"></span>
                        </button>
                        <div class="ff-load-more-meta" x-text="t('pagination.showing', { shown: (folders.length + files.length), total: listTotal })"></div>
                    </div>

                    <!-- Empty -->
                    <div class="ff-empty" x-show="(searchResults === null) && filteredFiles.length === 0 && filteredFolders.length === 0">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                        </svg>
                        <p x-text="t('file.no_files')"></p>
                        <button class="ff-empty-cta" @click="triggerUpload()">
                            <svg viewBox="0 0 12 12" fill="none"><path d="M6 1v7M3 4l3-3 3 3M2 10h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span x-text="t('toolbar.upload')"></span>
                        </button>
                    </div>
                </div>
            </template>

        </div>

        <!-- Status bar -->
        <div class="ff-status-bar">
            <span x-text="statusText"></span>
            <span style="margin-inline-start:auto;" class="sel-count" x-show="selected.length > 0" x-text="selected.length + ' selected'"></span>
            <span class="badge" :class="'badge-' + currentDisk" x-text="currentDisk.toUpperCase()"></span>
        </div>
    </div>

    <!-- ═══ Detail panel ═══ -->
    <div class="ff-detail" :class="{ open: detailFile }" :style="detailFile ? { '--ff-detail-w': detailPanelWidth + 'px' } : {}" x-show="!authRequired">

        <!-- Resize handle (desktop only) -->
        <div class="ff-detail-resize-handle" @mousedown="startResizeDetail($event)" x-show="detailFile" title="Drag to resize"></div>

        <div class="ff-detail-header">
            <h3 x-text="detailFile?.name"></h3>
            <button class="ff-detail-close" @click="detailFile = null">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- Preview thumbnail (click image to view full) -->
        <div class="detail-thumb" x-show="detailFile"
             :class="{ 'detail-thumb-clickable': detailFile && isPreviewable(detailFile, 'image') && detailFile.url }"
             @click="detailFile && isPreviewable(detailFile, 'image') && detailFile.url && (resetZoom(), previewFullscreen = true)">
            <template x-if="detailFile && isPreviewable(detailFile, 'image') && detailFile.url">
                <img :src="detailFile.url" :srcset="detailFile.img_srcset"
                     :sizes="detailFile.img_srcset ? (detailFile.img_sizes || '(max-width: 640px) 92vw, 380px') : null"
                     :alt="detailFile.name">
            </template>
            <template x-if="detailFile && isPreviewable(detailFile, 'video') && detailFile.url && !mediaTooLarge(detailFile)">
                <video controls style="width:100%;height:100%;object-fit:contain;" :src="detailFile.url" @error="refreshMediaSrc(detailFile, $event.target)"></video>
            </template>
            <template x-if="detailFile && isPreviewable(detailFile, 'audio') && detailFile.url && !mediaTooLarge(detailFile)">
                <audio controls style="width:100%;" :src="detailFile.url" @error="refreshMediaSrc(detailFile, $event.target)"></audio>
            </template>
            <!-- Media over max_preview_mb: skip the heavy <video>/<audio>, offer download. -->
            <template x-if="detailFile && (isPreviewable(detailFile, 'video') || isPreviewable(detailFile, 'audio')) && mediaTooLarge(detailFile)">
                <div class="ff-detail-thumb-icon ff-media-toolarge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    <p class="ff-media-toolarge-msg" x-text="t('file.too_large_preview')"></p>
                    <button type="button" class="tb-btn" @click="downloadFile(detailFile)">
                        <span x-text="t('common.download')"></span>
                    </button>
                </div>
            </template>
            <template x-if="detailFile && isPreviewable(detailFile, 'pdf') && detailFile.url">
                <embed :src="detailFile.url" type="application/pdf" style="width:100%;height:100%;">
            </template>
            <template x-if="detailFile && !isPreviewable(detailFile, 'image') && !isPreviewable(detailFile, 'video') && !isPreviewable(detailFile, 'audio') && !isPreviewable(detailFile, 'pdf')">
                <div class="ff-detail-thumb-icon">
                    <template x-if="fileIcon(detailFile) === 'folder'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    </template>
                    <template x-if="fileIcon(detailFile) === 'video'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    </template>
                    <template x-if="fileIcon(detailFile) === 'audio'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    </template>
                    <template x-if="fileIcon(detailFile) === 'document'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    </template>
                    <template x-if="fileIcon(detailFile) === 'image'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </template>
                    <template x-if="fileIcon(detailFile) === 'file'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </template>
                </div>
            </template>
        </div>

        <!-- Tags / disk badge -->
        <div class="detail-tags" x-show="detailFile">
            <span class="badge" :class="'badge-' + currentDisk" x-text="currentDisk.toUpperCase()"></span>
            <template x-for="(tag, idx) in aiTags" :key="idx">
                <span class="ff-tag">
                    <span x-text="tag"></span>
                    <button @click="removeTag(idx)">&times;</button>
                </span>
            </template>
        </div>

        <!-- Tabs -->
        <div class="ff-detail-tabs" x-show="detailFile">
            <button class="ff-tab-btn" :class="{ active: activeTab === 'info' }" @click="activeTab = 'info'" x-text="t('metadata.tab_info')"></button>
            <button class="ff-tab-btn" :class="{ active: activeTab === 'seo' }" @click="activeTab = 'seo'" x-show="detailFile && isPreviewable(detailFile, 'image')" x-text="t('metadata.tab_seo')"></button>
            <button class="ff-tab-btn"
                    :class="{ active: activeTab === 'ai' }"
                    @click="activeTab = 'ai'"
                    x-show="detailFile && isPreviewable(detailFile, 'image')"
                    x-text="t('metadata.tab_ai')"></button>
            <button class="ff-tab-btn"
                    :class="{ active: activeTab === 'crop' }"
                    @click="activeTab = 'crop'; initCrop()"
                    x-show="detailFile && isPreviewable(detailFile, 'image')"
                    x-text="t('metadata.tab_crop')"></button>
            <button class="ff-tab-btn"
                    :class="{ active: activeTab === 'watermark' }"
                    @click="activeTab = 'watermark'; initWatermark()"
                    x-show="detailFile && isPreviewable(detailFile, 'image')"
                    x-text="t('metadata.tab_watermark')"></button>
        </div>

        <!-- Info tab -->
        <div x-show="activeTab === 'info' && detailFile" style="flex:1;display:flex;flex-direction:column;gap:8px;">
            <div class="detail-info">
                <div class="detail-row"><span class="k" x-text="t('file.size')"></span><span class="v" x-text="detailFile?.type === 'dir' ? '—' : formatSize(detailFile?.size)"></span></div>
                <div class="detail-row"><span class="k" x-text="t('file.modified')"></span><span class="v" x-text="formatDate(detailFile?.modified)"></span></div>
                <div class="detail-row"><span class="k" x-text="t('file.disk')"></span><span class="v" x-text="currentDisk"></span></div>
                <div class="detail-row"><span class="k" x-text="t('file.path')"></span><span class="v" style="word-break:break-all;direction:ltr;" x-text="detailFile?.key"></span></div>
            </div>

            <!-- Variants / Image Sizes -->
            <div class="ff-variants" x-show="detailFile?.variants && Object.keys(detailFile.variants).length > 0">
                <div class="ff-variants-label" x-text="t('variants.title')"></div>
                <div class="ff-variants-list">
                    <button class="ff-variant-item" :class="{ 'ff-variant-active': selectedVariant === 'original' }" @click="selectVariant(detailFile, 'original')">
                        <span class="ff-variant-name" x-text="t('variants.original')"></span>
                        <span class="ff-variant-meta" x-text="formatSize(detailFile?.size)"></span>
                    </button>
                    <template x-for="size in ['thumb', 'medium', 'large']" :key="size">
                        <button class="ff-variant-item" :class="{ 'ff-variant-active': selectedVariant === size }" x-show="detailFile?.variants?.[size]" @click="selectVariant(detailFile, size)">
                            <span class="ff-variant-name" x-text="t('variants.' + size)"></span>
                            <span class="ff-variant-meta" x-text="size === 'thumb' ? '150px' : size === 'medium' ? '768px' : '1920px'"></span>
                        </button>
                    </template>
                </div>
                <div class="ff-variant-url" x-show="selectedVariant !== 'original'">
                    <span class="ff-variant-url-text" x-text="getActiveUrl(detailFile)"></span>
                </div>
            </div>

            <div class="detail-actions">
                <button class="detail-btn" @click="config.multiple && selected.length > 0 ? selectMultiple() : selectFile(detailFile)">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M4.5 7l2 2 3-3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.1"/></svg>
                    <span x-text="detailFile?.type === 'dir' ? t('common.select_folder') : t('common.select_file')"></span>
                </button>
                <button class="detail-btn" x-show="detailFile?.type !== 'dir'" @click="copyUrl(detailFile)">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M7.5 4.5a2.1 2.1 0 010 3l-1.5 1.5a2.1 2.1 0 01-3-3l.75-.75" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M4.5 7.5a2.1 2.1 0 010-3L6 3a2.1 2.1 0 013 3l-.75.75" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('toolbar.copy_url')"></span>
                </button>
                <button class="detail-btn" @click="openRename(detailFile)">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5l2 2-7 7H1.5V8.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.rename')"></span>
                </button>
                <button class="detail-btn" x-show="canEditFile(detailFile)" @click="openEditor(detailFile)" :title="t('editor.title')">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M4 3L1.5 6 4 9M8 3l2.5 3L8 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('editor.title')"></span>
                </button>
                <button class="detail-btn" x-show="canOptimizeFile(detailFile)" :disabled="optimizeBusy" @click="optimizeFiles([detailFile.key])" :title="t('optimize.title')">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v2M6 8.5v2M1.5 6h2M8.5 6h2M3 3l1.2 1.2M7.8 7.8L9 9M9 3L7.8 4.2M4.2 7.8L3 9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('optimize.title')"></span>
                </button>
                <button class="detail-btn" x-show="canChmod" @click="openChmod(detailFile)" :title="t('chmod.title')">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1.5a2 2 0 012 2V5H4V3.5a2 2 0 012-2z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="2.5" y="5" width="7" height="5.5" rx="1" stroke="currentColor" stroke-width="1.1"/></svg>
                    <span x-text="t('chmod.title')"></span>
                </button>
                <button class="detail-btn" x-show="canExtractFile(detailFile)" :disabled="zipBusy" @click="extractZip(detailFile)" :title="t('zip.extract')">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="2" y="2.5" width="8" height="7" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M6 4v3.5M4.5 6L6 7.5 7.5 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('zip.extract')"></span>
                </button>
                <button class="detail-btn" x-show="detailFile?.type === 'dir' && canZip" :disabled="zipBusy" @click="downloadZip([detailFile.key], detailFile.name)" :title="t('zip.download')">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="1.5" width="7" height="9" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M5 2.5h1.2M5 4h1.2M5 5.5h1.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('zip.download')"></span>
                </button>
                <button class="detail-btn" x-show="detailFile?.type !== 'dir'" @click="downloadFile(detailFile)">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 2v6M3.5 6l2.5 2.5L8.5 6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 10h8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                    <span x-text="t('common.download')"></span>
                </button>
                <button class="detail-btn" style="color:var(--color-text-danger);" @click="selected = [detailFile]; confirmDelete()">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M5 3V2h2v1M4.5 3v6.5h3V3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span x-text="t('common.delete')"></span>
                </button>
            </div>
        </div>

        <!-- SEO tab (collapsible accordion, images only) -->
        <div x-show="activeTab === 'seo' && detailFile && isPreviewable(detailFile, 'image')" style="flex:1;">
            <div class="ff-meta-accordion">
                <button type="button" class="ff-meta-accordion-header" @click="seoSectionExpanded = !seoSectionExpanded">
                    <span x-text="t('metadata.tab_seo')"></span>
