# Local dev/test stack: the FluxFiles standalone app + a LocalStack S3 backend.
#   docker compose up        → app at http://localhost:8080, S3 at :4566
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    # Runs the code baked into the image (composer deps already installed at build).
    command: sh -c "cd /app/packages/core && php -S 0.0.0.0:8080 router.php"
    ports:
      - "8080:8080"
    # For live-reload dev, mount the repo over the baked code (needs the repo path to
    # be in Docker Desktop's file-sharing list on macOS/Windows):
    #   volumes:
    #     - .:/app
    environment:
      FLUXFILES_SECRET: docker-dev-secret-key-0123456789abcdef
      FLUXFILES_RATE_LIMIT_READ: "100000"
      FLUXFILES_RATE_LIMIT_WRITE: "100000"
    depends_on:
      - s3

  s3:
    # S3-compatible backend for local dev. This used to be MinIO, but MinIO closed
    # its public images twice (bitnami/minio's free Docker Hub tags in 2025, then
    # minio/minio itself 403ing anonymous pulls in Sep 2026) and the quay.io mirror
    # its docs pointed at now 401s too — there is no anonymous MinIO image left.
    # LocalStack pulls anonymously and implements what this repo exercises
    # (multipart + presigned URLs + per-object visibility). Same swap as CI's
    # `s3-localstack` job — see .github/workflows/test.yml.
    #   credentials: test / test    endpoint: http://localhost:4566
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - s3-data:/var/lib/localstack

volumes:
  s3-data:
