# Page-referenced assets carry ?v=<content hash> (fm.js/fm.css/Alpine from index.php,
# the lazy xterm/CodeMirror files from fm.js's FM_VENDOR_VER), so a changed file always
# gets a new URL -> immutable for a year. Only a v that LOOKS like such a hash (8-32
# hex) earns that: nginx can't check it against the file (a hand-typed or stale v would
# pin the wrong bytes), so anything else - no v, v=1, v=latest - gets a short,
# revalidating cache (nginx sends ETag / Last-Modified).
map $arg_v $ff_assets_cache {
    default             "public, max-age=300, must-revalidate";
    "~^[0-9a-f]{8,32}$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /app/packages/core;
    index index.html;

    # fm.js is 236 KB raw / 57 KB gzipped, the UI HTML 219 KB / 34 KB. The stock
    # Alpine nginx config ships with gzip off. (text/html is always compressed.)
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API + locale-injected public HTML go through the PHP entrypoint.
    location /api/      { try_files $uri /api/index.php?$query_string; }

    # The public UI MUST be rendered by PHP so api/index.php can inject
    # window.__FM_LOCALE__ (messages + dir) before fm.js boots — otherwise
    # Alpine paints raw i18n keys until the async /api/fm/lang fetch lands.
    # A plain `try_files $uri ...` would serve the static index.html first and
    # skip PHP, so match exactly and rewrite straight to the entrypoint.
    location = /public           { rewrite ^ /api/index.php last; }
    location = /public/          { rewrite ^ /api/index.php last; }
    location = /public/index.html { rewrite ^ /api/index.php last; }

    # Immutable only for a hash-shaped ?v= - see the map above.
    location /assets/      { add_header Cache-Control $ff_assets_cache; }
    location = /fluxfiles.js { expires 7d; add_header Cache-Control "public"; }

    # Never expose storage-resident bookkeeping (metadata, audit and trash).
    # A regex location (it guards every non-`^~` location; the `^~`
    # /storage/uploads/ block below repeats it as a nested rule) because a path-scoped token keeps its bookkeeping at
    # `<prefix>/_fluxfiles/…`, so the directory is usually NESTED — a
    # `^~ /storage/uploads/_fluxfiles/` prefix rule only covers the unscoped
    # layout. Case-insensitive (`~*`) since on a case-insensitive filesystem
    # `_FLUXFILES/` resolves to the same directory. `_variants/` is deliberately
    # not blocked: variant URLs are public by design.
    location ~* /_fluxfiles/ { deny all; }

    # Everything else under storage/ is server runtime state, not public content:
    # ssh-sockets/ (multiplex index.json + ephemeral BYOB private keys), locks,
    # caches. `^~` stops the `\.php$` regex from claiming a file in there.
    # /storage/uploads/ below is a longer prefix, so public uploads still serve.
    location ^~ /storage/ { deny all; }

    # Uploaded files (local disk) — neutralize active content (SVG/HTML XSS).
    location ^~ /storage/uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        # `^~` above means nginx does NOT consult the server-level regex locations
        # for anything under here — so the `\.php$` FastCGI rule can never execute
        # an uploaded file, and the deny rules must be repeated as nested locations.
        location ~* /_fluxfiles/ { deny all; }
        location ~ /\. { deny all; }
        # Belt-and-braces: never hand a script-shaped upload to any handler.
        location ~* \.(php[0-9]?|pht|phtml?|phar|phps|pgif|shtml?|stm|cgi|pl|py|jsp|aspx?)$ { deny all; }
        location ~* \.(html?|xhtml|shtml|xml|svg)$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "sandbox" always;
            add_header Content-Disposition "attachment" always;
        }
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Gated local media (FLUXFILES_LOCAL_PRIVATE=true): PHP verifies the per-file
    # stream token, then hands the bytes to nginx via X-Accel-Redirect so nginx
    # serves them with native Range — PHP never copies the file. Enable by setting
    # FLUXFILES_XACCEL=/_ff_media (must match this internal location's prefix).
    # The disk root is mounted at /app/packages/core/storage/uploads.
    location /_ff_media/ {
        internal;
        alias /app/packages/core/storage/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
    location ~ ^/(\.env|composer\.|vendor/) { deny all; }
    location /_fluxfiles/ { deny all; }
}
