; Limits for the FluxFiles image (PHP's own defaults are 2M / 8M). The token's `max_upload`
; claim is the per-file limit that applies to a user. Keep these three in step:
; upload_max_filesize <= post_max_size <= client_max_body_size (docker/nginx.conf).
upload_max_filesize = 100M
post_max_size = 110M

; Uploads are streamed, but image processing (GD / intervention) and the file index of a
; busy tenant need more than PHP's 128M default.
memory_limit = 256M

; OPcache: the code in the image never changes at runtime, so never stat() it
; (validate_timestamps=0). Rebuild the image to deploy.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
