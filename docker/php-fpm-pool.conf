; Overrides the stock www pool (pm.max_children = 5). Tune without a rebuild:
;   docker run -e FPM_MAX_CHILDREN=48 ...   (docker/entrypoint.sh exports the defaults)
; Each worker can hold a large upload / image job, so keep
; max_children * memory_limit (docker/php.ini) inside the container's RAM.
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_MAX_REQUESTS}
